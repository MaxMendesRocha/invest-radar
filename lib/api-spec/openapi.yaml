openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gestão de Carteira de Investimentos API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: assets
    description: Portfolio assets
  - name: profile
    description: Investor risk profile
  - name: portfolio
    description: Portfolio summaries and analytics
  - name: alerts
    description: Radar intelligent alerts
  - name: opportunities
    description: Investment opportunities
  - name: transactions
    description: Dividend transactions
  - name: analysis
    description: Rules-based fundamentalist asset analysis
  - name: macro
    description: Macroeconomic indicators
  - name: sales
    description: Closed positions (asset sales) with realized capital gains

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── ASSETS ──────────────────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List portfolio assets
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Add an asset to portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get single asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Remove an asset from portfolio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /assets/{id}/sell:
    post:
      operationId: sellAsset
      tags: [assets, sales]
      summary: Close (fully or partially) a position, recording a real sale with realized gain/tax
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellAssetInput"
      responses:
        "201":
          description: Sale recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── SALES (closed positions) ─────────────────────────────────────────────────
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List closed positions (sales), most recent first
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"

  /sales/monthly-tax:
    get:
      operationId: getMonthlySalesTax
      tags: [sales]
      summary: Monthly capital gains tax consolidation by category, computed from real sale history (exemption + loss carryforward)
      responses:
        "200":
          description: Monthly tax summary per category, most recent month first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyCategoryTax"

  # ─── INVESTOR PROFILE ────────────────────────────────────────────────────────
  /profile:
    get:
      operationId: getInvestorProfile
      tags: [profile]
      summary: Get the current user's investor risk profile, if set
      responses:
        "200":
          description: Investor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorProfile"
        "404":
          description: Profile not set yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateInvestorProfile
      tags: [profile]
      summary: Create or update the current user's investor risk profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestorProfileInput"
      responses:
        "200":
          description: Saved investor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── PORTFOLIO SUMMARIES ─────────────────────────────────────────────────────
  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Get portfolio overview summary
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  /portfolio/distribution:
    get:
      operationId: getPortfolioDistribution
      tags: [portfolio]
      summary: Portfolio distribution by sector, asset class, and risk
      responses:
        "200":
          description: Distribution breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioDistribution"

  /portfolio/evolution:
    get:
      operationId: getPortfolioEvolution
      tags: [portfolio]
      summary: Portfolio value evolution over time
      responses:
        "200":
          description: Evolution data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionPoint"

  /portfolio/health:
    get:
      operationId: getPortfolioHealth
      tags: [portfolio]
      summary: Portfolio health score and breakdown
      responses:
        "200":
          description: Health score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioHealth"

  /portfolio/income-goal:
    get:
      operationId: getIncomeGoal
      tags: [portfolio]
      summary: Meta de renda passiva e progresso rumo a ela
      responses:
        "200":
          description: Meta e progresso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeGoalProgress"
        "404":
          description: Meta ainda não definida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertIncomeGoal
      tags: [portfolio]
      summary: Define ou atualiza a meta de renda passiva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeGoalInput"
      responses:
        "200":
          description: Meta salva, com progresso recalculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeGoalProgress"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio/benchmarks:
    get:
      operationId: getPortfolioBenchmarks
      tags: [portfolio]
      summary: Portfolio vs benchmark comparison (CDI, IBOV, IFIX)
      responses:
        "200":
          description: Benchmark comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkComparison"

  /portfolio/dividends/upcoming:
    get:
      operationId: getPortfolioDividendsUpcoming
      tags: [portfolio]
      summary: Upcoming dividend/JCP payments for assets currently held, based on real provider data
      responses:
        "200":
          description: List of upcoming dividend events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingDividend"

  /portfolio/dividends/projection:
    get:
      operationId: getPortfolioDividendsProjection
      tags: [portfolio]
      summary: Projected annual/monthly passive income from real dividend history, plus DY-on-cost/DY-on-price per asset and monthly distribution
      responses:
        "200":
          description: Dividend income projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioDividendsProjection"

  # ─── ALERTS ──────────────────────────────────────────────────────────────────
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List radar alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{id}/read:
    patch:
      operationId: markAlertRead
      tags: [alerts]
      summary: Mark an alert as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/{id}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Dismiss/delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Alert deleted

  # ─── OPPORTUNITIES ───────────────────────────────────────────────────────────
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: Top 10 investment opportunities
      responses:
        "200":
          description: List of opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityList"

  /opportunities/next-refresh:
    get:
      operationId: getOpportunitiesNextRefresh
      tags: [opportunities]
      summary: When the opportunities list was last regenerated and when the scheduler will run it again
      responses:
        "200":
          description: Last/next refresh timestamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunitiesNextRefresh"

  # ─── TRANSACTIONS ────────────────────────────────────────────────────────────
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List dividend transactions
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Record a dividend received
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/{id}:
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── ANALYSIS ────────────────────────────────────────────────────────────────
  /analysis/assets:
    get:
      operationId: listAssetAnalyses
      tags: [analysis]
      summary: Get analysis (status + score) for all portfolio assets
      responses:
        "200":
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetAnalysis"

  /analysis/assets/{ticker}:
    get:
      operationId: getAssetAnalysis
      tags: [analysis]
      summary: Get detailed analysis for a specific asset ticker
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetAnalysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/opinion/{ticker}:
    get:
      operationId: getAssetOpinion
      tags: [analysis]
      summary: Pre-purchase opinion on a ticker not necessarily held in the portfolio
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pre-purchase opinion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetOpinion"
        "404":
          description: Ticker not found or no quote available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/generate:
    post:
      operationId: generatePortfolioAnalysis
      tags: [analysis]
      summary: Regenerate rules-based analysis for the entire portfolio
      responses:
        "200":
          description: Analysis generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioReport"

  # ─── MACRO ───────────────────────────────────────────────────────────────────
  /macro:
    get:
      operationId: getMacroSnapshot
      tags: [macro]
      summary: Official indicators — Selic, IPCA, IGP-M, juro real and câmbio from the Banco Central, plus the Ibovespa
      responses:
        "200":
          description: Macro snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MacroSnapshot"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    # ─── AUTH SCHEMAS ─────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time

    UserRegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        password:
          type: string
          minLength: 6

    UserLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    # ─── ASSET SCHEMAS ────────────────────────────────────────────────────────
    Asset:
      type: object
      required: [id, userId, ticker, quantity, averagePrice, category, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        ticker:
          type: string
        quantity:
          type: number
        averagePrice:
          type: number
        purchaseDate:
          type: ["string", "null"]
          format: date
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs, fundos, renda_fixa]
        sector:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        currentPrice:
          type: ["number", "null"]
        totalValue:
          type: ["number", "null"]
        profitLoss:
          type: ["number", "null"]
        profitLossPercent:
          type: ["number", "null"]
        dividendFrequency:
          type: ["string", "null"]
          enum: [Mensal, Trimestral, Semestral, Anual, Irregular, null]
          description: Periodicidade real de pagamento de proventos nos últimos 12 meses, a partir do histórico real. Null se o ativo não pagou nada no período.
        createdAt:
          type: string
          format: date-time

    AssetInput:
      type: object
      required: [ticker, quantity, averagePrice, category]
      properties:
        ticker:
          type: string
          minLength: 1
        quantity:
          type: number
        averagePrice:
          type: number
        purchaseDate:
          type: ["string", "null"]
          format: date
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs, fundos, renda_fixa]
        sector:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    AssetUpdate:
      type: object
      properties:
        ticker:
          type: string
        quantity:
          type: number
        averagePrice:
          type: number
        purchaseDate:
          type: ["string", "null"]
          format: date
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs, fundos, renda_fixa]
        sector:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    SellAssetInput:
      type: object
      required: [salePrice, saleDate]
      properties:
        salePrice:
          type: number
        saleDate:
          type: string
          format: date
        quantity:
          type: ["number", "null"]
          description: Omitido ou igual à posição inteira = venda total (a posição é encerrada). Menor que a posição = venda parcial (a posição continua com a quantidade restante).

    Sale:
      type: object
      required: [id, userId, ticker, category, quantity, averagePrice, salePrice, saleDate, grossGain, taxOwed, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        ticker:
          type: string
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs, fundos, renda_fixa]
        quantity:
          type: number
        averagePrice:
          type: number
        salePrice:
          type: number
        saleDate:
          type: string
          format: date
        grossGain:
          type: number
        taxOwed:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MonthlyCategoryTax:
      type: object
      description: Apuração mensal de IR por categoria a partir do histórico real de vendas — evolução da estimativa isolada de Sale/taxOwed, agora com faixa de isenção e prejuízo compensado considerando todas as vendas do mês/categoria, não só uma venda isolada.
      required: [month, category, totalSaleValue, totalGrossGain, lossOffset, taxableGain, exempt, taxOwed, lossCarriedForward]
      properties:
        month:
          type: string
          description: "Formato YYYY-MM"
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs]
        totalSaleValue:
          type: number
        totalGrossGain:
          type: number
        lossOffset:
          type: number
          description: Quanto de prejuízo acumulado de meses anteriores foi usado pra abater o ganho deste mês.
        taxableGain:
          type: number
        exempt:
          type: boolean
          description: Só pra ações, quando o total vendido no mês foi ≤ R$20 mil.
        taxOwed:
          type: number
        lossCarriedForward:
          type: number
          description: Prejuízo acumulado que sobra pro próximo mês dessa categoria.

    # ─── INVESTOR PROFILE SCHEMAS ─────────────────────────────────────────────
    InvestorProfile:
      type: object
      required: [id, userId, horizon, lossTolerance, objective, experience, liquidityNeed, score, classification, updatedAt]
      description: >-
        classification é a MENOR entre capacityScore e toleranceScore, com travas
        aplicadas (ver constraints). Os campos revealed* descrevem o risco que a
        carteira real assume, independentemente do que foi declarado.
      properties:
        id:
          type: integer
        userId:
          type: integer
        horizon:
          type: string
          enum: [curto, medio, longo]
        lossTolerance:
          type: string
          enum: [baixa, media, alta]
        objective:
          type: string
          enum: [preservar, renda, crescimento]
        experience:
          type: string
          enum: [iniciante, intermediario, avancado]
        liquidityNeed:
          type: string
          enum: [sim, nao]
        score:
          type: number
        classification:
          type: string
          enum: [Conservador, Moderado, Arrojado]
        horizonYears:
          type: ["integer", "null"]
        emergencyFund:
          type: ["string", "null"]
        portfolioShare:
          type: ["string", "null"]
        incomeStability:
          type: ["string", "null"]
        capacityScore:
          type: ["number", "null"]
        toleranceScore:
          type: ["number", "null"]
        limitedBy:
          type: string
          enum: [capacidade, tolerancia, equilibrado]
        capacityComplete:
          type: boolean
          description: false quando o perfil foi salvo antes das perguntas de capacidade existirem
        constraints:
          type: array
          items:
            type: string
        revealedClassification:
          type: ["string", "null"]
          enum: [Conservador, Moderado, Arrojado, null]
        revealedVariableIncomePercent:
          type: ["number", "null"]
        revealedLargestPositionPercent:
          type: ["number", "null"]
        revealedLargestPositionTicker:
          type: ["string", "null"]
        revealedWeightedBeta:
          type: ["number", "null"]
        revealedBetaCoveragePercent:
          type: ["number", "null"]
        divergenceMessage:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time

    InvestorProfileInput:
      type: object
      required: [lossTolerance, objective, experience, liquidityNeed, horizonYears, emergencyFund, portfolioShare, incomeStability]
      properties:
        horizonYears:
          type: integer
          minimum: 0
          maximum: 60
          description: Horizonte em anos. Substitui o antigo horizon (curto/medio/longo), que passa a ser derivado deste.
        emergencyFund:
          type: string
          enum: [sim, nao]
          description: Reserva de emergência cobrindo ao menos 6 meses de despesas
        portfolioShare:
          type: string
          enum: [menos_25, de_25_50, de_50_75, mais_75]
          description: Fatia do patrimônio total que está nesta carteira
        incomeStability:
          type: string
          enum: [estavel, variavel, instavel]
        lossTolerance:
          type: string
          enum: [baixa, media, alta]
        objective:
          type: string
          enum: [preservar, renda, crescimento]
        experience:
          type: string
          enum: [iniciante, intermediario, avancado]
        liquidityNeed:
          type: string
          enum: [sim, nao]

    # ─── PORTFOLIO SCHEMAS ────────────────────────────────────────────────────
    PortfolioSummary:
      type: object
      required: [totalPatrimony, totalProfitLoss, totalProfitLossPercent, totalDividends, portfolioYield, assetCount]
      properties:
        totalPatrimony:
          type: number
        totalProfitLoss:
          type: number
        totalProfitLossPercent:
          type: number
        totalDividends:
          type: number
        portfolioYield:
          type: number
        assetCount:
          type: integer

    DistributionItem:
      type: object
      required: [label, value, percent]
      properties:
        label:
          type: string
        value:
          type: number
        percent:
          type: number

    PortfolioDistribution:
      type: object
      required: [bySector, byCategory, byRisk]
      properties:
        bySector:
          type: array
          items:
            $ref: "#/components/schemas/DistributionItem"
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/DistributionItem"
        byRisk:
          type: array
          items:
            $ref: "#/components/schemas/DistributionItem"

    EvolutionPoint:
      type: object
      required: [date, value]
      properties:
        date:
          type: string
        value:
          type: number
        cdi:
          type: ["number", "null"]
        ibov:
          type: ["number", "null"]

    PortfolioHealth:
      type: object
      required: [score, classification, diversification, risk, dividends, growth, concentration]
      properties:
        score:
          type: number
        classification:
          type: string
          enum: [Excelente, Boa, Regular, Ruim]
        diversification:
          type: number
        risk:
          type: number
        dividends:
          type: number
        growth:
          type: number
        concentration:
          type: number
        aiDiagnosis:
          type: [string, "null"]

    UpcomingDividend:
      type: object
      required: [ticker, paymentDate, label, rate, expectedAmount, confirmed]
      properties:
        ticker:
          type: string
        paymentDate:
          type: string
        label:
          type: string
        rate:
          type: number
        expectedAmount:
          type: number
        confirmed:
          type: boolean

    DividendProjectionAsset:
      type: object
      required: [ticker, category, quantity, dps12m, projectedAnnualIncome, dyOnPrice, dyOnCost]
      properties:
        ticker:
          type: string
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs]
        quantity:
          type: number
        dps12m:
          type: ["number", "null"]
          description: Dividendos/JCP reais por unidade pagos nos últimos 12 meses. Null quando não há histórico suficiente (nunca estimado).
        projectedAnnualIncome:
          type: ["number", "null"]
          description: dps12m × quantidade atual. Null quando dps12m é null.
        dyOnPrice:
          type: ["number", "null"]
          description: dps12m / preço atual, em % (ex. 6.5 = 6.5%).
        dyOnCost:
          type: ["number", "null"]
          description: dps12m / preço médio de compra, em %.

    DividendProjectionMonth:
      type: object
      required: [month, amount]
      properties:
        month:
          type: string
          description: "Formato YYYY-MM"
        amount:
          type: number
          description: Soma real de proventos pagos nesse mês, aplicada à quantidade atual de cada ativo.

    PortfolioDividendsProjection:
      type: object
      required: [projectedAnnualIncome, projectedMonthlyAverage, byAsset, byMonth]
      properties:
        projectedAnnualIncome:
          type: number
        projectedMonthlyAverage:
          type: number
        byAsset:
          type: array
          items:
            $ref: "#/components/schemas/DividendProjectionAsset"
        byMonth:
          type: array
          items:
            $ref: "#/components/schemas/DividendProjectionMonth"

    BenchmarkPoint:
      type: object
      required: [label, portfolio, cdi, ibov, ifix]
      properties:
        label:
          type: string
        portfolio:
          type: number
        cdi:
          type: number
        ibov:
          type: number
        ifix:
          type: number

    BenchmarkComparison:
      type: object
      required: [points, portfolioTotal, cdiTotal, ibovTotal, ifixTotal]
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/BenchmarkPoint"
        portfolioTotal:
          type: number
        cdiTotal:
          type: number
        ibovTotal:
          type: number
        ifixTotal:
          type: number

    # ─── ALERTS SCHEMAS ───────────────────────────────────────────────────────
    Alert:
      type: object
      required: [id, userId, type, severity, title, message, isRead, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [preco, fundamentos, dividendos, noticias, macroeconomico, concentracao, substituicao]
        severity:
          type: string
          enum: [Critico, Alto, Medio, Baixo]
        title:
          type: string
        message:
          type: string
        ticker:
          type: ["string", "null"]
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ─── OPPORTUNITY SCHEMAS ──────────────────────────────────────────────────
    OpportunityList:
      type: object
      required: [orderedBy, items]
      properties:
        dividendPremiumPending:
          type: boolean
          description: >-
            true quando o perfil pede ordenação por prêmio de dividendo mas a lista
            ainda não tem referência setorial — acontece com linhas gravadas antes da
            varredura que passou a persistir o setor. Some na próxima atualização.
        orderedBy:
          type: string
          enum: [premio_dividendo, perfil_de_risco, score]
          description: >-
            Critério que ordenou a lista. premio_dividendo quando o perfil declara
            objetivo de renda; perfil_de_risco quando há perfil com outro objetivo;
            score quando não há perfil definido.
        items:
          type: array
          items:
            $ref: "#/components/schemas/Opportunity"

    Opportunity:
      type: object
      required: [id, ticker, name, category, score, potentialReturn, dividendYield, riskLevel, reason, positives, risks, horizon]
      properties:
        id:
          type: integer
        ticker:
          type: string
        name:
          type: string
        category:
          type: string
        score:
          type: number
        potentialReturn:
          type: number
        dividendYield:
          type: number
        riskLevel:
          type: string
          enum: [Baixo, Medio, Alto]
        reason:
          type: string
        positives:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        sector:
          type: ["string", "null"]
        dividendPremiumPP:
          type: ["number", "null"]
          description: Diferença em p.p. entre o DY do ativo e a mediana do setor
        sectorMedianYield:
          type: ["number", "null"]
        sectorSampleSize:
          type: ["integer", "null"]
        implausibleYield:
          type: boolean
          description: DY acima do dobro da mediana setorial — faixa que costuma indicar amortização de cota, evento não recorrente ou preço em colapso
        dividendSustainability:
          type: ["string", "null"]
        horizon:
          type: string
        currentPrice:
          type: ["number", "null"]
        dividendFrequency:
          type: ["string", "null"]
          enum: [Mensal, Trimestral, Semestral, Anual, Irregular, null]
          description: Periodicidade real de pagamento de proventos nos últimos 12 meses, a partir do histórico real. Null se o ativo não pagou nada no período.

    OpportunitiesNextRefresh:
      type: object
      required: [lastRefreshedAt, nextRefreshAt]
      properties:
        lastRefreshedAt:
          type: ["string", "null"]
          description: Quando o job de regeneração rodou pela última vez com sucesso. Null se nunca rodou (banco novo, só com seed manual).
        nextRefreshAt:
          type: ["string", "null"]
          description: lastRefreshedAt + intervalo alvo do scheduler. Null se lastRefreshedAt for null.

    # ─── TRANSACTION SCHEMAS ──────────────────────────────────────────────────
    Transaction:
      type: object
      required: [id, userId, ticker, amount, type, date, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        ticker:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [dividendo, jcp, rendimento, amortizacao]
        date:
          type: string
          format: date
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    TransactionInput:
      type: object
      required: [ticker, amount, type, date]
      properties:
        ticker:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [dividendo, jcp, rendimento, amortizacao]
        date:
          type: string
          format: date
        notes:
          type: ["string", "null"]

    # ─── ANALYSIS SCHEMAS ─────────────────────────────────────────────────────
    TechnicalIndicators:
      type: object
      description: Indicadores técnicos determinísticos calculados sobre 1 ano de candles diários reais (technical-engine.ts) — cada campo é null quando não há histórico suficiente pra calculá-lo, nunca um valor estimado.
      required: [sma20, sma50, sma200, rsi14, macd, bollinger, crossSignal]
      properties:
        sma20:
          type: [number, "null"]
        sma50:
          type: [number, "null"]
        sma200:
          type: [number, "null"]
          description: Null quando há menos de 200 candles de histórico (ticker novo/pouco líquido).
        rsi14:
          type: [number, "null"]
        macd:
          type: [object, "null"]
          properties:
            line:
              type: number
            signal:
              type: number
            histogram:
              type: number
          required: [line, signal, histogram]
        bollinger:
          type: [object, "null"]
          properties:
            upper:
              type: number
            middle:
              type: number
            lower:
              type: number
            pricePosition:
              type: number
              description: 0-100%, posição do preço atual dentro da banda.
          required: [upper, middle, lower, pricePosition]
        crossSignal:
          type: [string, "null"]
          enum: [golden_cross_recente, death_cross_recente, acima_sma200, abaixo_sma200, null]

    AssetAnalysis:
      type: object
      required: [ticker, available, status, score, scoreClassification, positives, risks, newsItems, alerts, monitoringRecommendation, technical, updatedAt]
      properties:
        ticker:
          type: string
        available:
          type: boolean
          description: False when a full fundamentalist analysis isn't available yet (pending a data source) — score/status are placeholders and should not be shown.
        status:
          type: string
          enum: [COMPRAR, MANTER, VENDER]
        score:
          type: number
        scoreClassification:
          type: string
          enum: [Excelente, Forte, Estavel, Atencao, Critico]
        positives:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        newsItems:
          type: array
          items:
            type: string
        alerts:
          type: array
          items:
            type: string
        monitoringRecommendation:
          type: string
        taxEstimate:
          type: [object, "null"]
          description: Estimativa ISOLADA de IR sobre ganho de capital se o ativo fosse vendido agora (assume ser a única venda de renda variável do mês) — null pra renda_fixa/fundos ou quando o preço atual não está disponível.
          properties:
            grossGain:
              type: number
            taxRate:
              type: number
            taxOwed:
              type: number
            netGain:
              type: number
            exempt:
              type: boolean
          required: [grossGain, taxRate, taxOwed, netGain, exempt]
        technical:
          anyOf:
            - $ref: "#/components/schemas/TechnicalIndicators"
            - type: "null"
        dividendFrequency:
          type: ["string", "null"]
          enum: [Mensal, Trimestral, Semestral, Anual, Irregular, null]
          description: Periodicidade real de pagamento de proventos nos últimos 12 meses, a partir do histórico real. Null se o ativo não pagou nada no período.
        updatedAt:
          type: string
          format: date-time

    AssetOpinion:
      type: object
      required: [ticker, name, available, score, scoreClassification, positives, risks, price, fiftyTwoWeekHigh, fiftyTwoWeekLow, fiveDayChangePercent, dividendTrend, technical, newsItems, opinion, updatedAt]
      description: Parecer pré-compra sobre um ticker — não pressupõe que o ativo esteja na carteira, então não tem IR, % de concentração nem status de posição (COMPRAR/MANTER/VENDER).
      properties:
        ticker:
          type: string
        name:
          type: [string, "null"]
        available:
          type: boolean
          description: False quando o ticker tem cotação mas não há fundamentos aproveitáveis — score/positivos/riscos são placeholders nesse caso.
        score:
          type: number
        scoreClassification:
          type: string
          enum: [Excelente, Forte, Estavel, Atencao, Critico]
        positives:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        price:
          type: number
        fiftyTwoWeekHigh:
          type: [number, "null"]
        fiftyTwoWeekLow:
          type: [number, "null"]
        fiveDayChangePercent:
          type: [number, "null"]
        dividendTrend:
          type: [object, "null"]
          description: Crescimento real de provento (últimos 12 meses vs. 12 anteriores) por unidade — null quando o histórico não cobre os dois períodos.
          properties:
            last12mTotal:
              type: number
            prior12mTotal:
              type: number
            growthPercent:
              type: number
          required: [last12mTotal, prior12mTotal, growthPercent]
        technical:
          anyOf:
            - $ref: "#/components/schemas/TechnicalIndicators"
            - type: "null"
        dividendFrequency:
          type: ["string", "null"]
          enum: [Mensal, Trimestral, Semestral, Anual, Irregular, null]
          description: Periodicidade real de pagamento de proventos nos últimos 12 meses, a partir do histórico real. Null se o ativo não pagou nada no período.
        newsItems:
          type: array
          items:
            type: string
        opinion:
          type: string
        updatedAt:
          type: string
          format: date-time

    # ─── MACRO SCHEMAS ────────────────────────────────────────────────────────
    MacroSnapshot:
      type: object
      required: [selic, selicTrend, ipca12m, usdBrl, updatedAt]
      properties:
        selic:
          type: ["number", "null"]
        selicTrend:
          type: ["string", "null"]
          enum: [alta, queda, estavel, null]
        ipca12m:
          type: ["number", "null"]
        usdBrl:
          type: ["number", "null"]
        usdBrlChangePercent:
          type: ["number", "null"]
          description: Variação % do PTAX contra o fechamento anterior
        igpm12m:
          type: ["number", "null"]
          description: IGP-M acumulado 12 meses (%), composto a partir da série mensal do BCB
        realInterestRate:
          type: ["number", "null"]
          description: Juro real ex-post pela fórmula de Fisher, (1+Selic)/(1+IPCA)-1, em %
        ibovespa:
          type: ["number", "null"]
        ibovespaChangePercent:
          type: ["number", "null"]
        updatedAt:
          type: string
          format: date-time

    IncomeGoalInput:
      type: object
      required: [targetMonthlyIncome, targetYear]
      properties:
        targetMonthlyIncome:
          type: number
          minimum: 1
        targetYear:
          type: integer
          minimum: 2020
          maximum: 2100

    IncomeGoalProgress:
      type: object
      required: [targetYear, targetMonthlyIncome, currentMonthlyIncome, progressPercent, monthsRemaining, achieved, overdue]
      description: >-
        requiredMonthlyContribution não considera reinvestimento dos proventos, o que
        o torna conservador por construção — o percurso real tende a ser mais curto.
      properties:
        targetYear:
          type: integer
        targetMonthlyIncome:
          type: number
        currentMonthlyIncome:
          type: number
        progressPercent:
          type: number
        monthsRemaining:
          type: integer
        achieved:
          type: boolean
        overdue:
          type: boolean
        requiredCapital:
          type: ["number", "null"]
        capitalGap:
          type: ["number", "null"]
        requiredMonthlyContribution:
          type: ["number", "null"]

    PortfolioReport:
      type: object
      required: [generatedAt, summary, analyses, topAlerts, opportunities]
      properties:
        generatedAt:
          type: string
          format: date-time
        summary:
          $ref: "#/components/schemas/PortfolioSummary"
        analyses:
          type: array
          items:
            $ref: "#/components/schemas/AssetAnalysis"
        topAlerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/Opportunity"

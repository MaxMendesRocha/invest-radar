openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gestão de Carteira de Investimentos API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: assets
    description: Portfolio assets
  - name: profile
    description: Investor risk profile
  - name: portfolio
    description: Portfolio summaries and analytics
  - name: alerts
    description: Radar intelligent alerts
  - name: opportunities
    description: Investment opportunities
  - name: transactions
    description: Dividend transactions
  - name: analysis
    description: Rules-based fundamentalist asset analysis
  - name: macro
    description: Macroeconomic indicators
  - name: sales
    description: Closed positions (asset sales) with realized capital gains

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── ASSETS ──────────────────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List portfolio assets
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Add an asset to portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assets/validate-ticker:
    get:
      operationId: validateTicker
      tags: [assets]
      summary: >-
        Confere se um ticker tem cotação real antes de cadastrar/editar uma posição —
        pensado pra pegar erro de digitação (ex. "DVF11" em vez de "DVFF11") antes dele
        virar uma posição fantasma sem preço, sem se confundir com uma consolidação
        que falhou por diferença de categoria.
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resultado da checagem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickerValidation"

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get single asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Remove an asset from portfolio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /assets/{id}/purchases:
    get:
      operationId: listAssetPurchases
      tags: [assets]
      summary: Lançamentos de compra que produzem o preço médio da posição
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista de lançamentos, do mais antigo para o mais recente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetPurchase"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAssetPurchase
      tags: [assets]
      summary: Registra uma compra e recalcula quantidade e preço médio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetPurchaseInput"
      responses:
        "201":
          description: Posição já com quantidade e preço médio recalculados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Validation error, ou poupança (que não registra compra)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assets/{id}/purchases/{purchaseId}:
    delete:
      operationId: deleteAssetPurchase
      tags: [assets]
      summary: Remove um lançamento e recalcula a posição
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: purchaseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Posição já com quantidade e preço médio recalculados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "409":
          description: >-
            Último lançamento da posição. Apagá-lo deixaria quantidade e preço médio sem
            origem — para encerrar a posição, exclua a posição.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assets/{id}/sell:
    post:
      operationId: sellAsset
      tags: [assets, sales]
      summary: Close (fully or partially) a position, recording a real sale with realized gain/tax
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellAssetInput"
      responses:
        "201":
          description: Sale recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── SALES (closed positions) ─────────────────────────────────────────────────
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List closed positions (sales), most recent first
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"

  /sales/monthly-tax:
    get:
      operationId: getMonthlySalesTax
      tags: [sales]
      summary: Monthly capital gains tax consolidation by category, computed from real sale history (exemption + loss carryforward)
      responses:
        "200":
          description: Monthly tax summary per category, most recent month first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyCategoryTax"

  # ─── INVESTOR PROFILE ────────────────────────────────────────────────────────
  /profile:
    get:
      operationId: getInvestorProfile
      tags: [profile]
      summary: Get the current user's investor risk profile, if set
      responses:
        "200":
          description: Investor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorProfile"
        "404":
          description: Profile not set yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateInvestorProfile
      tags: [profile]
      summary: Create or update the current user's investor risk profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestorProfileInput"
      responses:
        "200":
          description: Saved investor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── PORTFOLIO SUMMARIES ─────────────────────────────────────────────────────
  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Get portfolio overview summary
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  /portfolio/distribution:
    get:
      operationId: getPortfolioDistribution
      tags: [portfolio]
      summary: Portfolio distribution by sector, asset class, and risk
      responses:
        "200":
          description: Distribution breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioDistribution"

  /portfolio/evolution:
    get:
      operationId: getPortfolioEvolution
      tags: [portfolio]
      summary: Portfolio value evolution over time
      responses:
        "200":
          description: Evolution data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionPoint"

  /portfolio/health:
    get:
      operationId: getPortfolioHealth
      tags: [portfolio]
      summary: Portfolio health score and breakdown
      responses:
        "200":
          description: Health score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioHealth"

  /treasury/bonds:
    get:
      operationId: listTreasuryBonds
      tags: [portfolio]
      summary: Títulos do Tesouro Direto disponíveis para cadastro de posição
      responses:
        "200":
          description: >-
            Títulos da data-base mais recente sincronizada. Lista vazia significa que a
            sincronização diária ainda não rodou, não que não haja títulos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreasuryBondOption"

  /treasury/price:
    get:
      operationId: getTreasuryPriceOnDate
      tags: [portfolio]
      summary: PU de compra de um título na data informada (ou na data-base anterior mais próxima)
      parameters:
        - name: bondType
          in: query
          required: true
          schema:
            type: string
        # `pattern` e não `format: date`: o orval gera zod.date() para format em query
        # param, e query string é sempre texto — o endpoint recusava toda chamada com
        # 400. O pattern documenta o formato E valida, sem depender de coerção.
        - name: maturityDate
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: PU encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreasuryPriceOnDate"
        "404":
          description: Sem publicação para esse título até a data pedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/treasury-opinion:
    get:
      operationId: getTreasuryOpinion
      tags: [analysis]
      summary: >-
        Comparação de taxa para um título do Tesouro Direto — o equivalente de "parecer"
        que renda fixa admite. Não tem score: compara a taxa de hoje deste título contra
        a própria faixa recente dele e contra Selic/IPCA atuais, nunca contra outro título.
      parameters:
        - name: bondType
          in: query
          required: true
          schema:
            type: string
        - name: maturityDate
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Comparação de taxa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreasuryOpinion"
        "404":
          description: Título não encontrado no catálogo sincronizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio/allocation:
    get:
      operationId: getAllocation
      tags: [portfolio]
      summary: Alocação-alvo por classe e desvio da carteira real em relação a ela
      responses:
        "200":
          description: Política, composição atual e desvio por classe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationOverview"
    put:
      operationId: upsertAllocation
      tags: [portfolio]
      summary: Define a alocação-alvo do usuário, substituindo o padrão do perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationInput"
      responses:
        "200":
          description: Política salva, com desvio recalculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationOverview"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio/allocation/plan:
    get:
      operationId: getAllocationPlan
      tags: [portfolio]
      summary: Onde aportar um valor novo para se aproximar da alocação-alvo
      parameters:
        - name: amount
          in: query
          required: true
          schema:
            type: number
            minimum: 0.01
      responses:
        "200":
          description: Distribuição sugerida do aporte, por classe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationPlan"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio/starter-portfolios:
    get:
      operationId: getStarterPortfolios
      tags: [portfolio]
      summary: As três carteiras-alvo por perfil, para quem ainda não tem posição
      parameters:
        - name: amount
          in: query
          required: false
          description: >-
            Valor de partida. Opcional de propósito: sem ele a resposta traz só os
            percentuais-alvo, porque qualquer valor padrão seria um número inventado.
          schema:
            type: number
            minimum: 0.01
      responses:
        "200":
          description: Uma carteira-alvo por perfil, mais o título do Tesouro comum às três
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarterPortfolios"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio/income-goal:
    get:
      operationId: getIncomeGoal
      tags: [portfolio]
      summary: Meta de renda passiva e progresso rumo a ela
      responses:
        "200":
          description: Meta e progresso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeGoalProgress"
        "404":
          description: Meta ainda não definida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertIncomeGoal
      tags: [portfolio]
      summary: Define ou atualiza a meta de renda passiva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeGoalInput"
      responses:
        "200":
          description: Meta salva, com progresso recalculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeGoalProgress"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio/benchmarks:
    get:
      operationId: getPortfolioBenchmarks
      tags: [portfolio]
      summary: Portfolio vs benchmark comparison (CDI, IBOV, IFIX)
      responses:
        "200":
          description: Benchmark comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkComparison"

  /portfolio/risk-metrics:
    get:
      operationId: getPortfolioRiskMetrics
      tags: [portfolio]
      summary: Volatility and month-by-month behaviour of the CURRENT portfolio composition, measured over one year of real daily closes
      responses:
        "200":
          description: Composition risk metrics, or the reason they are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioRiskMetrics"

  /portfolio/market-context:
    get:
      operationId: getPortfolioMarketContext
      tags: [portfolio]
      summary: Portfolio move against the market over 1/5/21 sessions, plus which asset drove it
      responses:
        "200":
          description: Market context, or the reason it is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioMarketContext"

  /portfolio/dividends/upcoming:
    get:
      operationId: getPortfolioDividendsUpcoming
      tags: [portfolio]
      summary: Upcoming dividend/JCP payments for assets currently held, based on real provider data
      responses:
        "200":
          description: List of upcoming dividend events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingDividend"

  /portfolio/dividends/pending:
    get:
      operationId: getPortfolioDividendsPending
      tags: [portfolio]
      summary: Proventos já pagos pelos ativos em carteira que ainda não têm lançamento registrado
      responses:
        "200":
          description: Pending dividend registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingDividend"

  /portfolio/dividends/pending/dismiss:
    post:
      operationId: dismissPendingDividend
      tags: [portfolio]
      summary: >-
        Marca um provento pendente como dispensado — some da lista de pendentes SEM
        criar transação. Diferente de "Registrar": não entra no total acumulado, no
        yield nem no cálculo de IR, é só "pare de me lembrar deste".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissPendingDividendInput"
      responses:
        "204":
          description: Dispensado

  /portfolio/dividends/projection:
    get:
      operationId: getPortfolioDividendsProjection
      tags: [portfolio]
      summary: Projected annual/monthly passive income from real dividend history, plus DY-on-cost/DY-on-price, magic number and concentration-safe purchase plan per asset, and monthly distribution
      responses:
        "200":
          description: Dividend income projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioDividendsProjection"

  # ─── ALERTS ──────────────────────────────────────────────────────────────────
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List radar alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{id}/read:
    patch:
      operationId: markAlertRead
      tags: [alerts]
      summary: Mark an alert as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/{id}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Dismiss/delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Alert deleted

  # ─── OPPORTUNITIES ───────────────────────────────────────────────────────────
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: Top 10 investment opportunities
      responses:
        "200":
          description: List of opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityList"

  /opportunities/next-refresh:
    get:
      operationId: getOpportunitiesNextRefresh
      tags: [opportunities]
      summary: When the opportunities list was last regenerated and when the scheduler will run it again
      responses:
        "200":
          description: Last/next refresh timestamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunitiesNextRefresh"

  # ─── TRANSACTIONS ────────────────────────────────────────────────────────────
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List dividend transactions
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Record a dividend received
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/{id}:
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── ANALYSIS ────────────────────────────────────────────────────────────────
  /analysis/assets:
    get:
      operationId: listAssetAnalyses
      tags: [analysis]
      summary: Get analysis (status + score) for all portfolio assets
      responses:
        "200":
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetAnalysis"

  /analysis/assets/{ticker}:
    get:
      operationId: getAssetAnalysis
      tags: [analysis]
      summary: Get detailed analysis for a specific asset ticker
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetAnalysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/opinion/{ticker}:
    get:
      operationId: getAssetOpinion
      tags: [analysis]
      summary: Pre-purchase opinion on a ticker not necessarily held in the portfolio
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pre-purchase opinion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetOpinion"
        "404":
          description: Ticker not found or no quote available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/generate:
    post:
      operationId: generatePortfolioAnalysis
      tags: [analysis]
      summary: Regenerate rules-based analysis for the entire portfolio
      responses:
        "200":
          description: Analysis generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioReport"

  # ─── MACRO ───────────────────────────────────────────────────────────────────
  # Preço-alvo é dado DO USUÁRIO (vem da casa de análise que ele assina), não do
  # provedor: targetMeanPrice dá 403 em todos os planos. Por isso fica fora de
  # /assets — a pergunta "quanto vale" é anterior a ter posição, e o uso principal é
  # o Parecer de Ativo, consultado sobre ticker que ainda não se comprou.
  /price-targets:
    get:
      operationId: listPriceTargets
      tags: [portfolio]
      summary: Price targets the user entered, with upside against the real quote
      responses:
        "200":
          description: List of price targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceTarget"

  /price-targets/{ticker}:
    put:
      operationId: upsertPriceTarget
      tags: [portfolio]
      summary: Create or update the user's price target for a ticker
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceTargetInput"
      responses:
        "200":
          description: Saved price target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceTarget"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePriceTarget
      tags: [portfolio]
      summary: Remove the user's price target for a ticker
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /macro:
    get:
      operationId: getMacroSnapshot
      tags: [macro]
      summary: Official indicators — Selic, IPCA, IGP-M, juro real and câmbio from the Banco Central, plus the Ibovespa
      responses:
        "200":
          description: Macro snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MacroSnapshot"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    # ─── AUTH SCHEMAS ─────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time

    UserRegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        password:
          type: string
          # NIST 800-63B: comprimento importa mais que regra de complexidade — 8 é o piso
          # recomendado, sem exigir maiúscula/símbolo/número, que empurra pra padrões
          # previsíveis ("Senha123!") sem ganho real de entropia.
          minLength: 8

    UserLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    # ─── ASSET SCHEMAS ────────────────────────────────────────────────────────
    Asset:
      type: object
      required: [id, userId, ticker, quantity, averagePrice, category, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        ticker:
          type: string
        quantity:
          type: number
        averagePrice:
          type: number
        purchaseDate:
          type: ["string", "null"]
          format: date
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs, fundos, renda_fixa]
        sector:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        treasuryBondType:
          type: ["string", "null"]
        treasuryMaturityDate:
          type: ["string", "null"]
          format: date
        isSavingsAccount:
          type: boolean
          description: >-
            Marca uma posição de renda_fixa como conta poupança. quantity fica em 1,
            averagePrice guarda o saldo conhecido, purchaseDate a data DESSE saldo (não a
            de abertura da conta) — currentPrice é a projeção de hoje via a série 195 do
            Banco Central (rendimento real da poupança, com a regra de TR já aplicada).
        currentPrice:
          type: ["number", "null"]
        priceAsOf:
          type: ["string", "null"]
          format: date-time
          description: >-
            Preenchido só quando currentPrice é o último preço conhecido em vez da
            cotação de agora (provedor indisponível) — é a data dessa última cotação.
            Null quando o preço é ao vivo.
        changePercent:
          type: ["number", "null"]
          description: >-
            Variação % do dia (fechamento contra o fechamento anterior), direto do
            provedor. Null pra título público — PU é publicado uma vez por dia, sem
            "fechou em alta/baixa hoje" real — e pra preço datado (provedor indisponível).
        totalValue:
          type: ["number", "null"]
        profitLoss:
          type: ["number", "null"]
        profitLossPercent:
          type: ["number", "null"]
        dividendFrequency:
          type: ["string", "null"]
          enum: [Mensal, Trimestral, Semestral, Anual, Irregular, null]
          description: Periodicidade real de pagamento de proventos nos últimos 12 meses, a partir do histórico real. Null se o ativo não pagou nada no período.
        corporateEventWarning:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CorporateEventWarning"
          description: >-
            Evento corporativo que o FII sofreu DEPOIS da data de compra registrada e que
            sempre altera o preço médio de quem já tinha a posição. Null pra qualquer
            outra classe, pra FII sem evento no período, e enquanto a série mensal da CVM
            não tiver sido sincronizada. O app avisa mas não corrige — não tem como saber
            o que a pessoa fez na corretora.
        createdAt:
          type: string
          format: date-time

    CorporateEventWarning:
      type: object
      required: [type, date, ratio, accumulatedFraction, purchaseDateUnknown]
      properties:
        type:
          type: string
          enum: [desdobramento, grupamento, amortizacao]
        date:
          type: string
          format: date
          description: Mês de referência do informe da CVM em que o evento aparece.
        ratio:
          type: ["number", "null"]
          description: >-
            Desdobramento 1:10 e grupamento 10:1 vêm ambos como 10 — o sentido está em
            type. Null para amortização.
        accumulatedFraction:
          type: ["number", "null"]
          description: >-
            Amortização acumulada desde a compra, em fração (0.0134 = 1,34%). Só é
            reportada acima de 1% acumulado, porque amortização mensal típica é da ordem
            de 0,18% e avisar a cada mês seria ruído. Null para desdobramento/grupamento.
        purchaseDateUnknown:
          type: boolean
          description: >-
            true quando a posição não tem purchaseDate registrada — nesse caso não dá pra
            afirmar que o evento é posterior à compra, e a interface diz isso.

    AssetPurchase:
      type: object
      required: [id, quantity, unitPrice, tradeDate, isInitialBalance, note]
      properties:
        id:
          type: integer
        quantity:
          type: number
        unitPrice:
          type: number
          description: Preço pago por unidade — PU no caso de Tesouro Direto.
        tradeDate:
          type: string
          format: date
          description: >-
            Data da NEGOCIAÇÃO, não da liquidação. A corretora costuma exibir a de
            liquidação (D+2), e confundir as duas leva a atribuir a compra ao dia errado.
        isInitialBalance:
          type: boolean
          description: >-
            Marca o lançamento derivado do saldo que já estava cadastrado, para posições
            anteriores ao registro de lançamentos. Não é uma nota de corretagem — é o que
            a pessoa informou — e a interface diz isso.
        note:
          type: ["string", "null"]

    AssetPurchaseInput:
      type: object
      required: [quantity, unitPrice, tradeDate]
      properties:
        quantity:
          type: number
          exclusiveMinimum: 0
        unitPrice:
          type: number
          exclusiveMinimum: 0
        tradeDate:
          type: string
          format: date
        note:
          type: string

    TickerValidation:
      type: object
      required: [valid, name]
      properties:
        valid:
          type: boolean
          description: true quando o ticker tem cotação real disponível agora (brapi.dev).
        name:
          type: ["string", "null"]
          description: Nome do ativo, quando encontrado — usado pra confirmar visualmente que é o papel certo, não só validar a string.

    AssetInput:
      type: object
      required: [ticker, quantity, averagePrice, category]
      properties:
        ticker:
          type: string
          minLength: 1
          description: >-
            Ignorado quando treasuryBondType/treasuryMaturityDate são enviados — nesse
            caso o servidor deriva um rótulo canônico do próprio título, para que duas
            compras do mesmo papel consolidem em vez de virarem posições separadas por
            diferença de digitação.
        treasuryBondType:
          type: ["string", "null"]
          description: >-
            Família do título público, exatamente como o Tesouro publica
            ("Tesouro IPCA+ com Juros Semestrais"). Só válido com category=renda_fixa,
            e sempre junto de treasuryMaturityDate. Ausente = renda fixa privada
            (CDB/LCI/LCA), que não tem fonte pública e segue no preço médio de compra.
        treasuryMaturityDate:
          type: ["string", "null"]
          format: date
        isSavingsAccount:
          type: boolean
          description: >-
            Só válido com category=renda_fixa. quantity deve vir 1, averagePrice o saldo
            conhecido, purchaseDate a data desse saldo — ver Asset.isSavingsAccount.
        quantity:
          type: number
        averagePrice:
          type: number
        purchaseDate:
          type: ["string", "null"]
          format: date
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs, fundos, renda_fixa]
        sector:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    AssetUpdate:
      type: object
      properties:
        ticker:
          type: string
        quantity:
          type: number
        averagePrice:
          type: number
        purchaseDate:
          type: ["string", "null"]
          format: date
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs, fundos, renda_fixa]
        sector:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    SellAssetInput:
      type: object
      required: [salePrice, saleDate]
      properties:
        salePrice:
          type: number
        saleDate:
          type: string
          format: date
        quantity:
          type: ["number", "null"]
          description: Omitido ou igual à posição inteira = venda total (a posição é encerrada). Menor que a posição = venda parcial (a posição continua com a quantidade restante).

    Sale:
      type: object
      required: [id, userId, ticker, category, quantity, averagePrice, salePrice, saleDate, grossGain, taxOwed, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        ticker:
          type: string
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs, fundos, renda_fixa]
        quantity:
          type: number
        averagePrice:
          type: number
        salePrice:
          type: number
        saleDate:
          type: string
          format: date
        grossGain:
          type: number
        taxOwed:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MonthlyCategoryTax:
      type: object
      description: Apuração mensal de IR por categoria a partir do histórico real de vendas — evolução da estimativa isolada de Sale/taxOwed, agora com faixa de isenção e prejuízo compensado considerando todas as vendas do mês/categoria, não só uma venda isolada.
      required: [month, category, totalSaleValue, totalGrossGain, lossOffset, taxableGain, exempt, taxOwed, lossCarriedForward]
      properties:
        month:
          type: string
          description: "Formato YYYY-MM"
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs]
        totalSaleValue:
          type: number
        totalGrossGain:
          type: number
        lossOffset:
          type: number
          description: Quanto de prejuízo acumulado de meses anteriores foi usado pra abater o ganho deste mês.
        taxableGain:
          type: number
        exempt:
          type: boolean
          description: Só pra ações, quando o total vendido no mês foi ≤ R$20 mil.
        taxOwed:
          type: number
        lossCarriedForward:
          type: number
          description: Prejuízo acumulado que sobra pro próximo mês dessa categoria.

    # ─── INVESTOR PROFILE SCHEMAS ─────────────────────────────────────────────
    InvestorProfile:
      type: object
      required: [id, userId, horizon, lossTolerance, objective, experience, liquidityNeed, score, classification, updatedAt]
      description: >-
        classification é a MENOR entre capacityScore e toleranceScore, com travas
        aplicadas (ver constraints). Os campos revealed* descrevem o risco que a
        carteira real assume, independentemente do que foi declarado.
      properties:
        id:
          type: integer
        userId:
          type: integer
        horizon:
          type: string
          enum: [curto, medio, longo]
        lossTolerance:
          type: string
          enum: [baixa, media, alta]
        objective:
          type: string
          enum: [preservar, renda, crescimento]
        experience:
          type: string
          enum: [iniciante, intermediario, avancado]
        liquidityNeed:
          type: string
          enum: [sim, nao]
        score:
          type: number
        classification:
          type: string
          enum: [Conservador, Moderado, Arrojado]
        horizonYears:
          type: ["integer", "null"]
        emergencyFund:
          type: ["string", "null"]
        portfolioShare:
          type: ["string", "null"]
        incomeStability:
          type: ["string", "null"]
        capacityScore:
          type: ["number", "null"]
        toleranceScore:
          type: ["number", "null"]
        limitedBy:
          type: string
          enum: [capacidade, tolerancia, equilibrado]
        capacityComplete:
          type: boolean
          description: false quando o perfil foi salvo antes das perguntas de capacidade existirem
        constraints:
          type: array
          items:
            type: string
        revealedClassification:
          type: ["string", "null"]
          enum: [Conservador, Moderado, Arrojado, null]
        revealedVariableIncomePercent:
          type: ["number", "null"]
        revealedLargestPositionPercent:
          type: ["number", "null"]
        revealedLargestPositionTicker:
          type: ["string", "null"]
        revealedWeightedBeta:
          type: ["number", "null"]
        revealedBetaCoveragePercent:
          type: ["number", "null"]
        divergenceMessage:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time

    InvestorProfileInput:
      type: object
      required: [lossTolerance, objective, experience, liquidityNeed, horizonYears, emergencyFund, portfolioShare, incomeStability]
      properties:
        horizonYears:
          type: integer
          minimum: 0
          maximum: 60
          description: Horizonte em anos. Substitui o antigo horizon (curto/medio/longo), que passa a ser derivado deste.
        emergencyFund:
          type: string
          enum: [sim, nao]
          description: Reserva de emergência cobrindo ao menos 6 meses de despesas
        portfolioShare:
          type: string
          enum: [menos_25, de_25_50, de_50_75, mais_75]
          description: Fatia do patrimônio total que está nesta carteira
        incomeStability:
          type: string
          enum: [estavel, variavel, instavel]
        lossTolerance:
          type: string
          enum: [baixa, media, alta]
        objective:
          type: string
          enum: [preservar, renda, crescimento]
        experience:
          type: string
          enum: [iniciante, intermediario, avancado]
        liquidityNeed:
          type: string
          enum: [sim, nao]

    # ─── PORTFOLIO SCHEMAS ────────────────────────────────────────────────────
    PortfolioSummary:
      type: object
      required: [totalPatrimony, totalProfitLoss, totalProfitLossPercent, totalDividends, portfolioYield, assetCount]
      properties:
        totalPatrimony:
          type: number
        totalProfitLoss:
          type: number
        totalProfitLossPercent:
          type: number
        totalDividends:
          type: number
          description: Acumulado de todos os proventos registrados, sem janela temporal
        dividendsLast12m:
          type: number
        yieldOnCost:
          type: number
          description: Proventos de 12 meses sobre o custo de aquisição
        pricesUnavailable:
          type: array
          description: >-
            Tickers cotados sem preço algum disponível — nem cotação de agora, nem
            último preço conhecido. A posição entra no patrimônio pelo preço médio de
            compra, então o lucro/prejuízo dela aparece como zero.
          items:
            type: string
        pricesStale:
          type: array
          description: >-
            Tickers avaliados pelo último preço conhecido porque o provedor não
            respondeu. O preço é real, só defasado — asOf diz de quando é.
          items:
            type: object
            required: [ticker, asOf]
            properties:
              ticker:
                type: string
              asOf:
                type: string
                format: date-time
        portfolioYield:
          type: number
          description: Proventos dos últimos 12 meses sobre o valor de mercado atual
        assetCount:
          type: integer

    DistributionItem:
      type: object
      required: [label, value, percent]
      properties:
        label:
          type: string
        value:
          type: number
        percent:
          type: number

    PortfolioDistribution:
      type: object
      required: [bySector, byCategory, byRisk]
      properties:
        bySector:
          type: array
          items:
            $ref: "#/components/schemas/DistributionItem"
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/DistributionItem"
        byRisk:
          type: array
          items:
            $ref: "#/components/schemas/DistributionItem"

    EvolutionPoint:
      type: object
      required: [date, value]
      properties:
        date:
          type: string
        value:
          type: number
        cdi:
          type: ["number", "null"]
        ibov:
          type: ["number", "null"]

    PortfolioHealth:
      type: object
      required: [score, classification, diversification, risk, dividends, growth, concentration]
      properties:
        score:
          type: number
        classification:
          type: string
          enum: [Excelente, Boa, Regular, Ruim]
        diversification:
          type: number
        risk:
          type: number
        dividends:
          type: number
        growth:
          type: number
        concentration:
          type: number
        aiDiagnosis:
          type: [string, "null"]

    UpcomingDividend:
      type: object
      required: [ticker, paymentDate, label, rate, expectedAmount, confirmed, exDate, certainty, uncertaintyKind, uncertaintyReason]
      description: >-
        Só entram eventos aos quais o usuário tem direito — comprado até a data-com
        (exDate). Antes desta checagem, TODO pagamento futuro do ticker era listado,
        mesmo sem a compra ter direito a ele; corrigido para usar a mesma regra de
        /portfolio/dividends/pending.
      properties:
        ticker:
          type: string
        paymentDate:
          type: string
        label:
          type: string
        rate:
          type: number
        expectedAmount:
          type: number
        # Reflete approvedOn: a aprovação em ata já está formalizada (true) ou é só um
        # cronograma projetado (false). Não confundir com `certainty`, que é sobre o
        # DIREITO do usuário a este provento, não sobre o provento em si.
        confirmed:
          type: boolean
        exDate:
          type: ["string", "null"]
          description: Data-com (lastDatePrior). Nullable pelo contrato do provider, sem faltar na amostra medida.
        certainty:
          type: string
          enum: [confirmado, incerto]
        uncertaintyKind:
          type: ["string", "null"]
          enum: [sem_data_compra, compra_proxima, null]
        uncertaintyReason:
          type: ["string", "null"]

    DividendProjectionAsset:
      type: object
      required: [ticker, category, quantity, dps12m, projectedAnnualIncome, dyOnPrice, dyOnCost, quality, magicNumberUnits, unitsRemaining, safeUnitsToAddNow, unitsBeyondSafeCeiling, alreadyAtOrOverCeiling]
      properties:
        ticker:
          type: string
        category:
          type: string
          enum: [acoes, fiis, etfs, bdrs]
        quantity:
          type: number
        dps12m:
          type: ["number", "null"]
          description: Dividendos/JCP reais por unidade pagos nos últimos 12 meses. Null quando não há histórico suficiente (nunca estimado).
        projectedAnnualIncome:
          type: ["number", "null"]
          description: dps12m × quantidade atual. Null quando dps12m é null.
        dyOnPrice:
          type: ["number", "null"]
          description: dps12m / preço atual, em % (ex. 6.5 = 6.5%).
        # Qualidade da distribuição — quão confiável é a renda, não quão alta. Null
        # quando o ativo não pagou nada em 12 meses. Ver distribution-quality-engine.ts.
        quality:
          oneOf:
            - $ref: "#/components/schemas/DistributionQuality"
            - type: "null"
        dyOnCost:
          type: ["number", "null"]
          description: dps12m / preço médio de compra, em %.
        magicNumberUnits:
          type: ["integer", "null"]
          description: >-
            Cotas necessárias pra essa posição se autossustentar (preço atual ÷
            dividendo médio real mensal), arredondado pra cima. Null sem dps12m ou
            sem preço real — nunca estimado.
        unitsRemaining:
          type: ["integer", "null"]
          description: Cotas que ainda faltam pro número mágico. Zero quando já atingiu ou passou. Null junto com magicNumberUnits.
        safeUnitsToAddNow:
          type: ["integer", "null"]
          description: >-
            Cotas que dá pra comprar AGORA sem estourar o teto "Atenção" de
            concentração do perfil do usuário (ver concentrationCeilingPercent
            abaixo). Null junto com magicNumberUnits.
        unitsBeyondSafeCeiling:
          type: ["integer", "null"]
          description: >-
            Cotas que faltam além do que é seguro comprar agora — dependem do
            patrimônio total crescer (aporte em OUTROS ativos), não de reforçar mais
            este. Null junto com magicNumberUnits.
        alreadyAtOrOverCeiling:
          type: ["boolean", "null"]
          description: true quando a posição já está no teto de concentração ou acima — não é seguro aportar mais nela agora, mesmo faltando pouco pro número mágico.

    DividendProjectionMonth:
      type: object
      required: [month, amount]
      properties:
        month:
          type: string
          description: "Formato YYYY-MM"
        amount:
          type: number
          description: Soma real de proventos pagos nesse mês, aplicada à quantidade atual de cada ativo.

    PortfolioDividendsProjection:
      type: object
      required: [projectedAnnualIncome, projectedMonthlyAverage, byAsset, byMonth, concentrationCeilingPercent]
      properties:
        projectedAnnualIncome:
          type: number
        projectedMonthlyAverage:
          type: number
        concentrationCeilingPercent:
          type: number
          description: >-
            Teto "Atenção" de concentração por ativo, conforme o perfil do usuário
            (concentrationLimitsFor, analysis-engine.ts) — o limite usado pro plano
            seguro de número mágico de cada ativo em byAsset.
        byAsset:
          type: array
          items:
            $ref: "#/components/schemas/DividendProjectionAsset"
        byMonth:
          type: array
          items:
            $ref: "#/components/schemas/DividendProjectionMonth"

    DistributionQuality:
      type: object
      required: [cadence, paymentsLast12m, expectedPayments, regularity, trendPercent, trendWindow, classification]
      properties:
        cadence:
          type: string
          enum: [Mensal, Trimestral, Semestral, Anual, Irregular]
        paymentsLast12m:
          type: integer
        # Quantos pagamentos a cadência do PRÓPRIO ativo prevê em 12 meses. É o que
        # torna a métrica neutra entre classes: FII mensal 12/12 e ação trimestral 4/4
        # valem o mesmo. Null quando a cadência é irregular e não há o que esperar.
        expectedPayments:
          type: ["integer", "null"]
        regularity:
          type: ["number", "null"]
          description: Observado ÷ esperado, com teto 1.
        trendPercent:
          type: ["number", "null"]
          description: Variação % da distribuição entre duas janelas iguais.
        trendWindow:
          type: ["string", "null"]
          enum: ["6m", "12m", null]
        classification:
          type: string
          enum: [Consistente, Atencao, Irregular, SemHistorico]

    PendingDividend:
      type: object
      required: [ticker, paymentDate, label, rate, exDate, quantity, suggestedAmount, certainty, uncertaintyKind, uncertaintyReason]
      properties:
        ticker:
          type: string
        paymentDate:
          type: string
        label:
          type: string
        rate:
          type: number
        # Data-com (lastDatePrior da brapi): último pregão com direito ao provento.
        # Quem comprou até aqui recebe; depois, não. Nullable porque o contrato do
        # provider permite, embora não tenha faltado em nenhum evento medido.
        exDate:
          type: ["string", "null"]
        quantity:
          type: number
        suggestedAmount:
          type: number
        # Com data-com e data de compra, o direito é DETERMINADO. "incerto" sobra só
        # para ativo sem data de compra cadastrada (ou, raríssimo, evento sem data-com)
        # — e aí quem decide é o usuário, porque o app não consegue afirmar.
        certainty:
          type: string
          enum: [confirmado, incerto]
        # "sem_data_compra" é propriedade do ativo e se repetiria igual em toda linha
        # dele; a tela agrega numa nota só. "compra_proxima" varia por evento.
        uncertaintyKind:
          type: ["string", "null"]
          enum: [sem_data_compra, compra_proxima, null]
        uncertaintyReason:
          type: ["string", "null"]

    DismissPendingDividendInput:
      type: object
      required: [ticker, paymentDate]
      properties:
        ticker:
          type: string
        paymentDate:
          type: string
          description: Mesma data do evento pendente (paymentDate em PendingDividend), formato YYYY-MM-DD.

    NewsItem:
      type: object
      required: [title, impact, link, summary]
      description: >-
        Notícia real do RSS do InfoMoney — título, impacto classificado, link real pro
        artigo e um resumo curto vindo do próprio <description> do feed (não é raspagem
        de página, é o campo que o publisher já disponibiliza pra syndication).
      properties:
        title:
          type: string
        impact:
          type: ["string", "null"]
          enum: ["Muito Positivo", "Positivo", "Neutro", "Negativo", "Muito Negativo", null]
        link:
          type: string
          description: URL real do artigo no InfoMoney. String vazia em notícia persistida antes desta mudança (sem link salvo).
        summary:
          type: ["string", "null"]
          description: Resumo curto real do RSS, HTML e rodapé do WordPress já removidos. Null sem resumo disponível.

    BenchmarkPoint:
      type: object
      required: [date, label, portfolio, cdi, ibov, ifix]
      properties:
        # Data do pregão em ISO. O eixo é diário: o calendário vem dos dias com
        # fechamento de IBOV e CDI publicado.
        date:
          type: string
          format: date
        label:
          type: string
          description: Rótulo curto do eixo, no formato dd/mm.
        # Null nos dias sem medição da carteira. `recordSnapshot` só grava quando a
        # pessoa abre o app, então a série da carteira é esparsa por construção — e o
        # dia sem acesso fica vazio em vez de repetir o valor da véspera, que pareceria
        # medição e não é. O gráfico liga os pontos existentes.
        portfolio:
          type: ["number", "null"]
        cdi:
          type: number
        ibov:
          type: number
        # Null quando o IFIX não cobre a janela inteira. Ele não tem histórico
        # gratuito disponível, então só acumula do momento em que o app começou a
        # sincronizar — nunca é preenchido com estimativa.
        ifix:
          type: ["number", "null"]

    BenchmarkComparison:
      type: object
      required:
        [points, granularity, windowDays, windowMonths, windowNote, portfolioTotal,
         cdiTotal, ibovTotal, ifixTotal, baseLabel, baseValue]
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/BenchmarkPoint"
        granularity:
          type: string
          enum: [diario]
          description: >-
            Resolução dos pontos. Era mensal até o comparativo passar a usar a série
            diária que já existia no banco — com janela curta, o gráfico mensal tinha
            dois pontos e virava uma reta sem percurso.
        # Quantos pontos (pregões) o comparativo cobre.
        windowDays:
          type: integer
        # O mesmo intervalo expresso em meses aproximados, para o texto da tela.
        # Retorno acumulado só é comparável entre séries medidas no mesmo intervalo,
        # então a janela é o trecho em que todas têm dado real — e `points` fica vazio
        # quando não há sequer dois pregões comparáveis.
        windowMonths:
          type: integer
        windowNote:
          type: ["string", "null"]
        portfolioTotal:
          type: ["number", "null"]
        cdiTotal:
          type: ["number", "null"]
        ibovTotal:
          type: ["number", "null"]
        ifixTotal:
          type: ["number", "null"]
        # Dia que abre a janela (dd/mm) e patrimônio nele — o ponto de onde TODAS as
        # séries partem de 0%. É sempre um dia com medição real da carteira, nunca
        # interpolado, porque é o denominador do rebase. Exposto porque sem ele a diferença entre o
        # percentual do gráfico e o do card Resultado (que mede contra o custo, não
        # contra o valor de partida) só se resolve refazendo a conta à mão. Null
        # quando não há janela comparável.
        baseLabel:
          type: ["string", "null"]
        baseValue:
          type: ["number", "null"]

    # Responde "sou eu ou é o mercado?". A atribuição é por CONTRIBUIÇÃO (peso ×
    # movimento) e não por variação: medido, o ativo que mais caiu (KLBN3, -4,53%)
    # custou 0,12pp enquanto o que menos caiu (MXRF11, -1,48%) explicou 63% da queda,
    # porque pesa 67%. Ordenar por variação — o que o olho faz sozinho — leva à
    # conclusão errada sobre onde está o problema.
    PortfolioMarketContext:
      type: object
      required: [available, reason, context]
      properties:
        available:
          type: boolean
        reason:
          type: ["string", "null"]
        context:
          oneOf:
            - $ref: "#/components/schemas/MarketContext"
            - type: "null"

    MarketContext:
      type: object
      required:
        [windows, attribution, attributionSessions, attributionTotalPercent, benchmarkLabel,
         benchmarkNote, coveragePercent, uncovered, asOf, narrative]
      properties:
        windows:
          type: array
          items:
            $ref: "#/components/schemas/MarketContextWindow"
        attribution:
          type: array
          items:
            $ref: "#/components/schemas/DropAttribution"
        attributionSessions:
          type: integer
        attributionTotalPercent:
          type: number
        benchmarkLabel:
          type: string
        # Preenchido quando o benchmark exibido não é o espelho da carteira — carteira
        # majoritariamente de FII contra IBOV, porque o IFIX não tem série histórica
        # disponível no provedor de cotação.
        benchmarkNote:
          type: ["string", "null"]
        coveragePercent:
          type: number
        uncovered:
          type: array
          items:
            type: string
        asOf:
          type: string
          format: date
        # Texto da IA explicando o movimento, escrito SOBRE os números acima e ancorado
        # em manchetes reais dos ativos. Null sem ANTHROPIC_API_KEY ou em caso de erro —
        # o card funciona inteiro sem ele.
        narrative:
          type: ["string", "null"]

    MarketContextWindow:
      type: object
      required: [label, sessions, portfolioPercent, benchmarkPercent]
      properties:
        label:
          type: string
        sessions:
          type: integer
        portfolioPercent:
          type: number
        benchmarkPercent:
          type: ["number", "null"]

    DropAttribution:
      type: object
      required: [ticker, weightPercent, movePercent, contributionPp]
      properties:
        ticker:
          type: string
        weightPercent:
          type: number
        movePercent:
          type: number
        # Pontos percentuais da carteira. A soma aproxima a variação total.
        contributionPp:
          type: number

    # Mede a COMPOSIÇÃO DE HOJE contra um ano de fechamentos reais, mantendo as
    # quantidades atuais fixas. Responde "quão oscilante é o que eu tenho", e não
    # "como foi o meu histórico" — este último sai dos snapshots, em
    # BenchmarkComparison, e exige meses de uso do app. As duas medidas não se
    # somam nem se substituem.
    PortfolioRiskMetrics:
      type: object
      required: [available, reason, metrics, correlation]
      properties:
        available:
          type: boolean
        # Por que não há métrica: carteira sem ativo de bolsa, ou pregões em comum
        # insuficientes. Preenchido só quando available é false.
        reason:
          type: ["string", "null"]
        metrics:
          oneOf:
            - $ref: "#/components/schemas/CompositionRisk"
            - type: "null"
        # Disponibilidade independente de `metrics`: correlação exige um PAR de
        # ativos cotados cobertos, enquanto volatilidade da composição funciona com
        # um só. Null quando há menos de dois, ou pregões em comum insuficientes.
        correlation:
          oneOf:
            - $ref: "#/components/schemas/AssetCorrelationSummary"
            - type: "null"

    AssetCorrelationPair:
      type: object
      required: [tickerA, tickerB, correlation, combinedWeightPercent]
      properties:
        tickerA:
          type: string
        tickerB:
          type: string
        correlation:
          type: number
          description: Pearson sobre retornos diários reais (adjustedClose), não sobre preço bruto. -1 a 1.
        combinedWeightPercent:
          type: number
          description: "% do valor COBERTO (não do total da carteira) que as duas posições juntas representam."

    AssetCorrelationSummary:
      type: object
      required:
        [pairs, averageCorrelation, highlyCorrelatedCount, totalPairs, tradingDays, fromDate, toDate,
         coveragePercent, uncovered]
      description: >-
        Correlação real entre pares de ativos da carteira. Aditivo à diversificação
        por setor já calculada em /portfolio/health — setor é um PROXY de
        correlação, não a correlação em si; este número é a medição direta sobre
        retornos diários reais. Não substitui nem altera a nota de diversificação.
      properties:
        pairs:
          type: array
          description: >-
            Os pares mais correlacionados POSITIVAMENTE, até 5 — ordenado do mais
            positivo pro menos, não por valor absoluto: correlação bem negativa é um
            hedge natural entre os dois ativos, o oposto de um problema, então não
            entra na mesma lista de "pares que escondem concentração".
          items:
            $ref: "#/components/schemas/AssetCorrelationPair"
        averageCorrelation:
          type: number
          description: Média entre TODOS os pares medidos, não só os exibidos em `pairs`.
        highlyCorrelatedCount:
          type: integer
          description: "Pares com correlação >= 0,7 (positiva). Não conta anti-correlação."
        totalPairs:
          type: integer
        tradingDays:
          type: integer
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        coveragePercent:
          type: number
        uncovered:
          type: array
          items:
            type: string

    CompositionRisk:
      type: object
      required:
        [volatility, benchmarkVolatility, tradingDays, fromDate, toDate, monthlyReturns,
         positiveMonths, monthsAboveBenchmark, coveragePercent, uncovered]
      properties:
        # Desvio-padrão dos retornos diários anualizado (× √252), em %.
        volatility:
          type: number
        # A do IBOV, medida exatamente nos mesmos pregões. Null quando a série do
        # índice não cobre o intervalo.
        benchmarkVolatility:
          type: ["number", "null"]
        tradingDays:
          type: integer
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        monthlyReturns:
          type: array
          items:
            $ref: "#/components/schemas/RiskMonthlyReturn"
        positiveMonths:
          type: integer
        monthsAboveBenchmark:
          type: ["integer", "null"]
        # Quanto do VALOR da carteira a medição cobre. Renda fixa não tem série
        # diária de bolsa e fica de fora; sem este campo a volatilidade de quem tem
        # metade em renda fixa seria subestimada em silêncio.
        coveragePercent:
          type: number
        uncovered:
          type: array
          items:
            type: string

    RiskMonthlyReturn:
      type: object
      required: [month, percent, benchmarkPercent]
      properties:
        # "YYYY-MM"
        month:
          type: string
        percent:
          type: number
        benchmarkPercent:
          type: ["number", "null"]

    # ─── ALERTS SCHEMAS ───────────────────────────────────────────────────────
    Alert:
      type: object
      required: [id, userId, type, severity, title, message, isRead, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [preco, fundamentos, dividendos, noticias, macroeconomico, concentracao, substituicao]
        severity:
          type: string
          enum: [Critico, Alto, Medio, Baixo]
        title:
          type: string
        message:
          type: string
        ticker:
          type: ["string", "null"]
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ─── OPPORTUNITY SCHEMAS ──────────────────────────────────────────────────
    OpportunityList:
      type: object
      required: [orderedBy, items]
      properties:
        dividendPremiumPending:
          type: boolean
          description: >-
            true quando o perfil pede ordenação por prêmio de dividendo mas a lista
            ainda não tem referência setorial — acontece com linhas gravadas antes da
            varredura que passou a persistir o setor. Some na próxima atualização.
        orderedBy:
          type: string
          enum: [premio_dividendo, perfil_de_risco, score]
          description: >-
            Critério que ordenou a lista. premio_dividendo quando o perfil declara
            objetivo de renda; perfil_de_risco quando há perfil com outro objetivo;
            score quando não há perfil definido.
        items:
          type: array
          items:
            $ref: "#/components/schemas/Opportunity"

    Opportunity:
      type: object
      required: [id, ticker, name, category, score, potentialReturn, dividendYield, riskLevel, reason, positives, risks, horizon]
      properties:
        id:
          type: integer
        ticker:
          type: string
        name:
          type: string
        category:
          type: string
        score:
          type: number
        potentialReturn:
          type: number
        dividendYield:
          type: number
        riskLevel:
          type: string
          enum: [Baixo, Medio, Alto]
        reason:
          type: string
        positives:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        sector:
          type: ["string", "null"]
        dividendPremiumPP:
          type: ["number", "null"]
          description: Diferença em p.p. entre o DY do ativo e a mediana do setor
        sectorMedianYield:
          type: ["number", "null"]
        sectorSampleSize:
          type: ["integer", "null"]
        implausibleYield:
          type: boolean
          description: DY acima do dobro da mediana setorial — faixa que costuma indicar amortização de cota, evento não recorrente ou preço em colapso
        dividendSustainability:
          type: ["string", "null"]
        horizon:
          type: string
        currentPrice:
          type: ["number", "null"]
        priceAsOf:
          type: ["string", "null"]
          format: date-time
          description: >-
            Preenchido só quando currentPrice é o último preço conhecido em vez da
            cotação de agora (provedor indisponível) — é a data dessa última cotação.
            Null quando o preço é ao vivo. Mesmo campo e mesma semântica de Asset.priceAsOf.
        dividendFrequency:
          type: ["string", "null"]
          enum: [Mensal, Trimestral, Semestral, Anual, Irregular, null]
          description: Periodicidade real de pagamento de proventos nos últimos 12 meses, a partir do histórico real. Null se o ativo não pagou nada no período.

    OpportunitiesNextRefresh:
      type: object
      required: [lastRefreshedAt, nextRefreshAt]
      properties:
        lastRefreshedAt:
          type: ["string", "null"]
          description: Quando o job de regeneração rodou pela última vez com sucesso. Null se nunca rodou (banco novo, só com seed manual).
        nextRefreshAt:
          type: ["string", "null"]
          description: lastRefreshedAt + intervalo alvo do scheduler. Null se lastRefreshedAt for null.

    # ─── TRANSACTION SCHEMAS ──────────────────────────────────────────────────
    Transaction:
      type: object
      required: [id, userId, ticker, amount, type, date, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        ticker:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [dividendo, jcp, rendimento, amortizacao]
        date:
          type: string
          format: date
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    TransactionInput:
      type: object
      required: [ticker, amount, type, date]
      properties:
        ticker:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [dividendo, jcp, rendimento, amortizacao]
        date:
          type: string
          format: date
        notes:
          type: ["string", "null"]

    # ─── ANALYSIS SCHEMAS ─────────────────────────────────────────────────────
    TechnicalIndicators:
      type: object
      description: Indicadores técnicos determinísticos calculados sobre 1 ano de candles diários reais (technical-engine.ts) — cada campo é null quando não há histórico suficiente pra calculá-lo, nunca um valor estimado.
      required: [sma20, sma50, sma200, rsi14, macd, bollinger, crossSignal]
      properties:
        sma20:
          type: [number, "null"]
        sma50:
          type: [number, "null"]
        sma200:
          type: [number, "null"]
          description: Null quando há menos de 200 candles de histórico (ticker novo/pouco líquido).
        rsi14:
          type: [number, "null"]
        macd:
          type: [object, "null"]
          properties:
            line:
              type: number
            signal:
              type: number
            histogram:
              type: number
          required: [line, signal, histogram]
        bollinger:
          type: [object, "null"]
          properties:
            upper:
              type: number
            middle:
              type: number
            lower:
              type: number
            pricePosition:
              type: number
              description: 0-100%, posição do preço atual dentro da banda.
          required: [upper, middle, lower, pricePosition]
        crossSignal:
          type: [string, "null"]
          enum: [golden_cross_recente, death_cross_recente, acima_sma200, abaixo_sma200, null]

    TaxEstimate:
      type: object
      required: [grossGain, taxRate, taxOwed, netGain, exempt]
      properties:
        grossGain:
          type: number
        taxRate:
          type: number
        taxOwed:
          type: number
        netGain:
          type: number
        exempt:
          type: boolean
          description: True quando dentro da isenção de ações (venda ≤ R$ 20.000 no mês).

    TrimSuggestion:
      type: object
      required: [value, quantity, percentOfPosition, targetPercent]
      properties:
        value:
          type: number
          description: Valor a reduzir, em reais.
        quantity:
          type: number
          description: Quantidade correspondente, ao preço atual.
        percentOfPosition:
          type: number
        targetPercent:
          type: number
          description: Faixa de concentração para onde a posição volta depois da redução.
        taxEstimate:
          description: >-
            IR estimado sobre a FATIA vendida, não sobre a posição inteira — a isenção
            mensal de R$ 20 mil em ações é sobre o valor da venda, então estimar pelo
            total exageraria o imposto justamente quando a venda parcial o evita.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TaxEstimate"

    AssetAnalysis:
      type: object
      required: [ticker, available, status, score, scoreClassification, positives, risks, newsItems, alerts, monitoringRecommendation, technical, updatedAt]
      properties:
        ticker:
          type: string
        available:
          type: boolean
          description: False when a full fundamentalist analysis isn't available yet (pending a data source) — score/status are placeholders and should not be shown.
        status:
          type: string
          enum: [COMPRAR, MANTER, VENDER]
        statusReason:
          type: ["string", "null"]
          enum: [fundamentos, concentracao, fundamentos_e_concentracao, null]
          description: >-
            Por que o status é VENDER — null nos demais. As duas causas pedem ações
            opostas: "fundamentos" é sobre o ativo (a tese piorou, e não há quantidade
            calculável a vender), "concentracao" é sobre o tamanho da posição (o ativo
            pode ser ótimo, e a resposta é reduzir até a faixa saudável).
        trimSuggestion:
          description: >-
            Quanto vender para a posição voltar ao limite saudável do perfil. Presente
            só quando a concentração é causa do VENDER, porque só nesse caso "quanto
            vender" é conta e não opinião. Assume que o valor é realocado dentro da
            carteira — se o dinheiro sair, seria preciso vender mais.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TrimSuggestion"
        score:
          type: number
        scoreClassification:
          type: string
          enum: [Excelente, Forte, Estavel, Atencao, Critico]
        positives:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        newsItems:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
        alerts:
          type: array
          items:
            type: string
        monitoringRecommendation:
          type: string
        taxEstimate:
          description: Estimativa ISOLADA de IR sobre ganho de capital se o ativo fosse vendido agora (assume ser a única venda de renda variável do mês) — null pra renda_fixa/fundos ou quando o preço atual não está disponível.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TaxEstimate"
        technical:
          anyOf:
            - $ref: "#/components/schemas/TechnicalIndicators"
            - type: "null"
        dividendFrequency:
          type: ["string", "null"]
          enum: [Mensal, Trimestral, Semestral, Anual, Irregular, null]
          description: Periodicidade real de pagamento de proventos nos últimos 12 meses, a partir do histórico real. Null se o ativo não pagou nada no período.
        updatedAt:
          type: string
          format: date-time

    PriceTarget:
      type: object
      required: [ticker, targetPrice, source, notes, currentPrice, upsidePercent, updatedAt]
      properties:
        ticker:
          type: string
        targetPrice:
          type: number
        # Procedência em texto livre ("Eleven", "meu cálculo", "consenso") — é o que o
        # usuário reconhece, não um enum que o app tenha autoridade para definir.
        source:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        currentPrice:
          type: ["number", "null"]
        # A única coisa que o app calcula aqui: (alvo − cotação) / cotação. O alvo em
        # si é dado de terceiro, e apresentá-lo como medição do Radar seria mentira.
        upsidePercent:
          type: ["number", "null"]
        updatedAt:
          type: string
          format: date-time

    PriceTargetInput:
      type: object
      required: [targetPrice]
      properties:
        targetPrice:
          type: number
          exclusiveMinimum: 0
        source:
          type: ["string", "null"]
          maxLength: 80
        notes:
          type: ["string", "null"]
          maxLength: 500

    # Triagem pré-compra: afirmação sobre a RÉGUA DO APP ("atende ao corte de score"),
    # nunca sobre o que a pessoa deve fazer. Não reaproveita COMPRAR/MANTER/VENDER da
    # Análise de Ativos porque aquele status depende de quanto o ativo pesa na carteira,
    # e para quem não tem posição isso não significa nada.
    PurchaseScreening:
      type: object
      required: [outcome, scoreThreshold, riskCount]
      properties:
        outcome:
          type: string
          enum: [atende, nao_atende, sem_dados]
        scoreThreshold:
          type: number
        # Contagem de fatores de risco, exibida AO LADO do resultado e não embutida
        # nele: reprovar por risco exigiria definir quais são eliminatórios, e o
        # limiar genérico de alavancagem reprovaria transmissora e saneamento por
        # funcionarem como funcionam. Calibrar isso pede medição antes.
        riskCount:
          type: integer

    DividendEntitlementPreview:
      type: object
      required: [paymentDate, rate, label, exDate, entitledIfBoughtToday]
      description: >-
        Um provento anunciado e se comprar HOJE dá direito a ele — a data que decide é
        a data-com (exDate), não a data de pagamento. As duas costumam vir separadas
        por semanas (até 112 dias na amostra medida de PETR4), e essa distância é
        exatamente o que confunde quem vê "paga dia X" e compra pensando que X é o
        prazo.
      properties:
        paymentDate:
          type: string
        label:
          type: string
        rate:
          type: number
        exDate:
          type: ["string", "null"]
          description: Data-com. Nullable pelo contrato do provider, sem faltar na amostra medida.
        entitledIfBoughtToday:
          type: ["boolean", "null"]
          description: >-
            Null só no caso (não observado na amostra) de o provento vir sem data-com
            — aí não há base pra afirmar nada, e a incerteza é dita, não escondida.

    AssetOpinion:
      type: object
      required: [ticker, name, available, score, scoreClassification, positives, risks, price, fiftyTwoWeekHigh, fiftyTwoWeekLow, fiveDayChangePercent, dividendTrend, technical, newsItems, opinion, screening, updatedAt]
      description: Parecer pré-compra sobre um ticker — não pressupõe que o ativo esteja na carteira, então não tem IR, % de concentração nem status de posição (COMPRAR/MANTER/VENDER).
      properties:
        ticker:
          type: string
        name:
          type: [string, "null"]
        available:
          type: boolean
          description: False quando o ticker tem cotação mas não há fundamentos aproveitáveis — score/positivos/riscos são placeholders nesse caso.
        score:
          type: number
        scoreClassification:
          type: string
          enum: [Excelente, Forte, Estavel, Atencao, Critico]
        positives:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        price:
          type: number
        fiftyTwoWeekHigh:
          type: [number, "null"]
        fiftyTwoWeekLow:
          type: [number, "null"]
        fiveDayChangePercent:
          type: [number, "null"]
        dividendTrend:
          type: [object, "null"]
          description: Crescimento real de provento (últimos 12 meses vs. 12 anteriores) por unidade — null quando o histórico não cobre os dois períodos.
          properties:
            last12mTotal:
              type: number
            prior12mTotal:
              type: number
            growthPercent:
              type: number
          required: [last12mTotal, prior12mTotal, growthPercent]
        technical:
          anyOf:
            - $ref: "#/components/schemas/TechnicalIndicators"
            - type: "null"
        dividendFrequency:
          type: ["string", "null"]
          enum: [Mensal, Trimestral, Semestral, Anual, Irregular, null]
          description: Periodicidade real de pagamento de proventos nos últimos 12 meses, a partir do histórico real. Null se o ativo não pagou nada no período.
        nextDividend:
          oneOf:
            - $ref: "#/components/schemas/DividendEntitlementPreview"
            - type: "null"
          description: >-
            O próximo provento anunciado pelo provedor, esteja ou não ao alcance de
            quem comprar hoje — null quando não há nada anunciado (comum em FII, cujo
            endpoint só cobre pagamento já liquidado).
        nextEntitledDividend:
          oneOf:
            - $ref: "#/components/schemas/DividendEntitlementPreview"
            - type: "null"
          description: >-
            Presente só quando `nextDividend` existe e `entitledIfBoughtToday` é
            false: o próximo provento que uma compra hoje efetivamente alcançaria.
            Null quando o mais próximo já é o certo, ou quando nada mais está
            anunciado depois dele.
        newsItems:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
        opinion:
          type: string
        screening:
          $ref: "#/components/schemas/PurchaseScreening"
        updatedAt:
          type: string
          format: date-time

    # ─── MACRO SCHEMAS ────────────────────────────────────────────────────────
    MacroSnapshot:
      type: object
      required: [selic, selicTrend, ipca12m, usdBrl, updatedAt]
      properties:
        selic:
          type: ["number", "null"]
        selicTrend:
          type: ["string", "null"]
          enum: [alta, queda, estavel, null]
        ipca12m:
          type: ["number", "null"]
        usdBrl:
          type: ["number", "null"]
        usdBrlChangePercent:
          type: ["number", "null"]
          description: Variação % do PTAX contra o fechamento anterior
        igpm12m:
          type: ["number", "null"]
          description: IGP-M acumulado 12 meses (%), composto a partir da série mensal do BCB
        realInterestRate:
          type: ["number", "null"]
          description: Juro real ex-post pela fórmula de Fisher, (1+Selic)/(1+IPCA)-1, em %
        ibovespa:
          type: ["number", "null"]
        ibovespaChangePercent:
          type: ["number", "null"]
        updatedAt:
          type: string
          format: date-time

    AllocationTarget:
      type: object
      required: [category, targetPercent]
      properties:
        category:
          type: string
          enum: [renda_fixa, acoes, fiis, etfs, bdrs, fundos]
        targetPercent:
          type: number
          minimum: 0
          maximum: 100

    AllocationInput:
      type: object
      required: [targets]
      description: Os alvos precisam somar 100%.
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/AllocationTarget"

    AllocationItem:
      type: object
      required: [category, targetPercent, currentPercent, currentValue, deviationPp, deviationValue]
      properties:
        category:
          type: string
        targetPercent:
          type: number
        currentPercent:
          type: number
        currentValue:
          type: number
        deviationPp:
          type: number
          description: Positivo = classe abaixo do alvo; negativo = acima.
        deviationValue:
          type: number
          description: Quanto falta (positivo) ou sobra (negativo) em reais para bater o alvo hoje.

    AllocationOverview:
      type: object
      required: [source, totalPatrimony, items]
      properties:
        source:
          type: string
          enum: [personalizado, perfil, generico]
          description: >-
            De onde vem a política em uso. "personalizado" = salva pelo usuário;
            "perfil" = padrão derivado do perfil de investidor; "generico" = padrão
            usado por falta de perfil preenchido, não calculado a partir das respostas.
        totalPatrimony:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/AllocationItem"

    PurchaseSizing:
      type: object
      required: [unitPrice, units, investedAmount, leftover]
      description: >-
        Quanto comprar, em quantidade, se a fatia inteira da classe for para este ativo.
        Nunca arredonda para cima: sugerir quantidade que custa mais que a fatia seria
        mandar gastar dinheiro que o usuário não disse que tem.
      properties:
        unitPrice:
          type: number
          description: Cotação usada na conta, para o usuário conferir.
        units:
          type: number
          description: >-
            Unidades inteiras em bolsa (mercado fracionário negocia a partir de 1);
            múltiplos de 0,01 título no Tesouro Direto. Zero é resposta válida — a
            fatia não alcança uma unidade, ou não atinge o piso de R$ 30 do Tesouro.
        investedAmount:
          type: number
        leftover:
          type: number
          description: O que sobra da fatia. Sem isso a soma não fecha na tela.

    AllocationPlanSuggestion:
      type: object
      required: [ticker, name, score, reason]
      properties:
        ticker:
          type: string
        name:
          type: string
        score:
          type: number
        reason:
          type: string
        sizing:
          oneOf:
            - $ref: "#/components/schemas/PurchaseSizing"
            - type: "null"
          description: >-
            Null quando não há cotação real para o ticker. Estimar preço para poder
            mostrar quantidade seria inventar o número mais fácil de conferir na tela.

    TreasuryPriceOnDate:
      type: object
      required: [baseDate, buyUnitPrice]
      properties:
        baseDate:
          type: string
          format: date
          description: >-
            Data-base efetivamente usada. Pode ser anterior à pedida — compra em fim de
            semana ou feriado não tem publicação no próprio dia, e a tela precisa dizer
            de quando é o número.
        buyUnitPrice:
          type: number

    TreasuryBondOption:
      type: object
      required: [bondType, maturityDate, baseDate, buyRate, buyUnitPrice, label]
      properties:
        bondType:
          type: string
        maturityDate:
          type: string
          format: date
        baseDate:
          type: string
          format: date
        buyRate:
          type: number
        buyUnitPrice:
          type: number
        sellUnitPrice:
          type: ["number", "null"]
          description: >-
            PU de recompra — é este lado que marca uma posição já detida. Null quando o
            arquivo não trouxe: a posição fica no preço médio em vez de ser marcada pelo
            preço de compra, que a superestimaria.
        label:
          type: string
          description: Rótulo canônico usado como ticker da posição, ex. "TESOURO IPCA+ 2035".

    TreasuryRateRange:
      type: object
      required: [days, min, max, avg, sampleCount, percentile]
      description: >-
        Faixa da taxa de compra do MESMO título nos últimos `days` dias-base publicados —
        nunca comparada contra outro título, que teria prêmio de prazo diferente.
      properties:
        days:
          type: number
        min:
          type: number
        max:
          type: number
        avg:
          type: number
        sampleCount:
          type: number
          description: Quantidade de dias-base na janela. A faixa só existe quando há pelo menos 15.
        percentile:
          type: ["number", "null"]
          description: >-
            Posição da taxa de hoje na faixa, 0-100. Null quando a taxa não se moveu na
            janela (mín. igual ao máx.) — não há posição relativa real pra reportar.

    TreasuryOpinion:
      type: object
      required: [bondType, maturityDate, label, baseDate, buyRate, buyUnitPrice, rateLabel, indexer, rateRange, macro, liquidityNote]
      description: >-
        Comparação de taxa pra um título específico do Tesouro Direto — não é score, é a
        taxa de hoje contra a própria faixa recente do título e contra o cenário de juro
        atual. Sem IA: todo campo aqui é número real ou texto determinístico sobre ele.
      properties:
        bondType:
          type: string
        maturityDate:
          type: string
          format: date
        label:
          type: string
        baseDate:
          type: string
          format: date
        buyRate:
          type: number
        buyUnitPrice:
          type: number
        rateLabel:
          type: string
          description: Taxa já rotulada conforme a família — ver TreasurySuggestion.rateLabel.
        indexer:
          type: ["string", "null"]
          enum: [selic, ipca, prefixado, null]
          description: Null para família fora da allowlist de sugestão (ex. só-recompra, sem oferta ativa).
        rateRange:
          oneOf:
            - $ref: "#/components/schemas/TreasuryRateRange"
            - type: "null"
          description: Null quando o histórico na janela de 90 dias é curto demais pra uma faixa confiável.
        macro:
          type: object
          required: [selic, selicTrend, ipca12m, realInterestRate]
          properties:
            selic:
              type: ["number", "null"]
            selicTrend:
              type: ["string", "null"]
              enum: [alta, queda, estavel, null]
            ipca12m:
              type: ["number", "null"]
            realInterestRate:
              type: ["number", "null"]
              description: Juro real ex-post pela fórmula de Fisher, em %.
        liquidityNote:
          type: string
          description: >-
            Nota sobre marcação a mercado no resgate antecipado — só o Tesouro Selic
            escapa dela.

    TreasurySuggestion:
      type: object
      required: [bondType, maturityDate, baseDate, rateLabel, unitPrice, minimumInvestment, reason]
      properties:
        bondType:
          type: string
        maturityDate:
          type: string
          format: date
        baseDate:
          type: string
          format: date
          description: >-
            Data-base da taxa. O Tesouro publica o arquivo com um ou dois dias úteis de
            atraso, então a taxa nunca é "de agora" — exibir a data junto.
        rateLabel:
          type: string
          description: >-
            Taxa já rotulada conforme a família ("IPCA + 8,04% a.a.", "14,11% a.a.",
            "Selic + 0,04%"). O número cru significa coisas diferentes em cada uma — no
            Tesouro Selic é ágio/deságio sobre a Selic, não o rendimento.
        unitPrice:
          type: number
          description: Preço do título inteiro.
        minimumInvestment:
          type: number
          description: Compra mínima — 1% do título, com piso de R$ 30 do Tesouro Direto.
        reason:
          type: string
        sizing:
          oneOf:
            - $ref: "#/components/schemas/PurchaseSizing"
            - type: "null"
          description: >-
            Fração do título que a fatia de renda fixa compra, em múltiplos de 0,01.

    AllocationPlanItem:
      type: object
      required: [category, amount, sharePercent, suggestions, suggestionsStatus]
      properties:
        category:
          type: string
        amount:
          type: number
        sharePercent:
          type: number
          description: Fatia deste aporte, não o alvo da classe na carteira.
        suggestionsStatus:
          type: string
          enum: [ok, sem_ticker_de_bolsa, sem_candidato, tesouro_indisponivel]
          description: >-
            Por que a lista de sugestões está vazia, quando está. "sem_ticker_de_bolsa"
            = renda fixa e fundos, que não são ranqueáveis por ticker. "sem_candidato"
            = classe negociada em bolsa que não tem nenhum ativo aprovado na varredura
            — hoje é o caso dos ETFs, que não têm fundamento individual (P/L, ROE,
            margem) e por isso não passam pela triagem por fundamentos.
            "tesouro_indisponivel" = renda fixa cuja sincronização com o Tesouro
            Direto ainda não rodou ou falhou; `sem_ticker_de_bolsa` segue valendo para
            fundos, que não têm fonte nenhuma.
        suggestions:
          type: array
          description: Ativos da classe, na mesma ordem da tela de Oportunidades.
          items:
            $ref: "#/components/schemas/AllocationPlanSuggestion"
        treasurySuggestions:
          type: array
          description: >-
            Títulos do Tesouro Direto sugeridos para a fatia de renda fixa. Lista
            separada de `suggestions` de propósito: título público não tem ticker nem
            score do Radar, e encaixá-lo naquele formato exigiria inventar os dois.
          items:
            $ref: "#/components/schemas/TreasurySuggestion"

    AllocationPlan:
      type: object
      required: [amount, source, orderedBy, items]
      properties:
        amount:
          type: number
        source:
          type: string
          enum: [personalizado, perfil, generico]
        orderedBy:
          type: string
          description: Critério de ordenação das sugestões, o mesmo de /opportunities.
        items:
          type: array
          items:
            $ref: "#/components/schemas/AllocationPlanItem"
        deviationBefore:
          type: number
          description: Soma dos desvios absolutos (pp) antes do aporte.
        deviationAfter:
          type: number
          description: Soma dos desvios absolutos (pp) depois do aporte sugerido.

    StarterPortfolioItem:
      type: object
      required: [category, targetPercent, amount, suggestions, suggestionsStatus]
      properties:
        category:
          type: string
        targetPercent:
          type: number
          description: >-
            Peso da classe na carteira-alvo do perfil — não a fatia do valor de partida.
            Os dois divergem quando o piso por fatia derruba uma classe, e nesse caso
            `amount` vem 0 com `targetPercent` maior que zero.
        amount:
          type: ["number", "null"]
          description: >-
            Null quando nenhum valor de partida foi informado. Zero quando foi, e a
            classe não alcançou o piso mínimo de compra — o valor dela foi redistribuído.
        suggestionsStatus:
          type: string
          enum: [ok, sem_ticker_de_bolsa, sem_candidato, tesouro_indisponivel]
          description: Mesmos valores e mesmos significados de AllocationPlanItem.
        suggestions:
          type: array
          description: >-
            Candidatos da classe, na ordem de risco do perfil desta coluna — o mesmo
            critério da tela de Oportunidades, ver lib/opportunity-ranking.ts.
          items:
            $ref: "#/components/schemas/AllocationPlanSuggestion"

    StarterPortfolio:
      type: object
      required: [classification, fixedIncomePercent, items]
      properties:
        classification:
          type: string
          enum: [Conservador, Moderado, Arrojado]
        fixedIncomePercent:
          type: number
          description: >-
            O número de destaque da coluna, e o único com respaldo de praxe de mercado
            (ver fixedIncomeBasis).
        items:
          type: array
          items:
            $ref: "#/components/schemas/StarterPortfolioItem"

    StarterPortfolios:
      type: object
      required: [amount, declaredClassification, hasAssets, fixedIncomeBasis, variableSplitBasis, treasury, profiles]
      description: >-
        As três carteiras-alvo lado a lado. `treasury` fica fora de `profiles` porque o
        título sugerido depende das respostas do questionário (liquidez, reserva,
        horizonte), não da classificação de risco — é o mesmo nas três colunas, e a
        forma da resposta afirma isso.
      properties:
        amount:
          type: ["number", "null"]
        declaredClassification:
          type: ["string", "null"]
          enum: [Conservador, Moderado, Arrojado, null]
          description: >-
            Perfil já declarado pelo usuário, para a tela destacar a coluna dele. Null
            quando o questionário ainda não foi respondido — o caso que motiva a tela.
        hasAssets:
          type: boolean
          description: >-
            A tela ignora a carteira existente por construção. Quando isto é true ela
            precisa dizer que o ajuste do que já existe é em Saúde do Portfólio.
        fixedIncomeBasis:
          type: string
          enum: [praxe_de_mercado]
          description: Origem da divisão renda fixa x variável (80/60/30).
        variableSplitBasis:
          type: string
          enum: [convencao_do_app]
          description: >-
            Origem da divisão da parte variável entre ações, FIIs e ETFs. Não é praxe
            consagrada, e a tela precisa apresentá-la com peso menor que o campo acima.
        treasury:
          type: object
          required: [suggestions]
          properties:
            suggestions:
              type: array
              items:
                $ref: "#/components/schemas/TreasurySuggestion"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/StarterPortfolio"

    IncomeGoalInput:
      type: object
      required: [targetMonthlyIncome, targetYear]
      properties:
        targetMonthlyIncome:
          type: number
          minimum: 1
        targetYear:
          type: integer
          minimum: 2020
          maximum: 2100

    IncomeGoalProgress:
      type: object
      required: [targetYear, targetMonthlyIncome, currentMonthlyIncome, progressPercent, monthsRemaining, achieved, overdue]
      description: >-
        requiredMonthlyContribution não considera reinvestimento dos proventos, o que
        o torna conservador por construção — o percurso real tende a ser mais curto.
      properties:
        targetYear:
          type: integer
        targetMonthlyIncome:
          type: number
        currentMonthlyIncome:
          type: number
        progressPercent:
          type: number
        monthsRemaining:
          type: integer
        achieved:
          type: boolean
        overdue:
          type: boolean
        requiredCapital:
          type: ["number", "null"]
        capitalGap:
          type: ["number", "null"]
        requiredMonthlyContribution:
          type: ["number", "null"]

    PortfolioReport:
      type: object
      required: [generatedAt, summary, analyses, topAlerts, opportunities]
      properties:
        generatedAt:
          type: string
          format: date-time
        summary:
          $ref: "#/components/schemas/PortfolioSummary"
        analyses:
          type: array
          items:
            $ref: "#/components/schemas/AssetAnalysis"
        topAlerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/Opportunity"

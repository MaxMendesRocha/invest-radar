name: db-diagnose-oneoff
on:
  workflow_dispatch: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar estado do banco
        env:
          PGURL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client >/dev/null
          echo "===== tabelas existentes ====="
          psql "$PGURL" -At -c "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;"
          echo "===== tabela session ====="
          psql "$PGURL" -At -c "SELECT CASE WHEN to_regclass('public.session') IS NULL THEN 'AUSENTE' ELSE 'existe' END;"
          psql "$PGURL" -At -c "SELECT 'linhas: ' || count(*) FROM session;" 2>&1 | head -2
          echo "===== colunas novas de opportunities ====="
          psql "$PGURL" -At -c "SELECT column_name FROM information_schema.columns WHERE table_name='opportunities' AND column_name IN ('sector','dividend_frequency','dividend_sustainability');"
          echo "===== volumes ====="
          psql "$PGURL" -At -c "SELECT 'users=' || (SELECT count(*) FROM users) || ' assets=' || (SELECT count(*) FROM assets) || ' opportunities=' || (SELECT count(*) FROM opportunities) || ' analyses=' || (SELECT count(*) FROM analyses);"

name: DB migrate (one-off)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version:` — o pnpm/action-setup lê o campo packageManager do
      # package.json, e declarar as duas coisas faz a action falhar por conflito.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      # A troca da chave única de treasury_bonds vai em SQL explícito porque
      # `drizzle-kit push` para e pede confirmação interativa ao alterar constraint de
      # tabela com linhas ("Do you want to truncate?"), e `--force` NÃO cobre esse
      # prompt — num runner sem TTY isso é falha certa. Feito assim, nada é truncado:
      # as linhas existentes são todas de uma data-base só e já satisfazem a chave
      # nova, então a marcação a mercado não fica sem preço em nenhum momento.
      - name: Troca a chave única de treasury_bonds
        env:
          PGURL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE treasury_bonds DROP CONSTRAINT IF EXISTS treasury_bonds_type_maturity_unique;
          ALTER TABLE treasury_bonds ADD CONSTRAINT treasury_bonds_type_maturity_base_unique UNIQUE (bond_type, maturity_date, base_date);
          CREATE INDEX IF NOT EXISTS "IDX_treasury_bonds_base_date" ON treasury_bonds (base_date);
          SQL

      - name: drizzle-kit push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @workspace/db run push-force

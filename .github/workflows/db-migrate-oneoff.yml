name: DB migrate (one-off)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version:` — o pnpm/action-setup lê o campo packageManager do
      # package.json, e declarar as duas coisas faz a action falhar por conflito.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: drizzle-kit push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @workspace/db run push-force

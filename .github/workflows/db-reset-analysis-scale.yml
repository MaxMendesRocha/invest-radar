name: Verifica a regeneração na escala nova (one-off)

# Workflow temporário da subida do PR #44. As duas primeiras etapas já rodaram:
# apagar o cache na escala antiga (`analyses`, `opportunities`) e zerar o `job_runs`
# do `regenerate-opportunities` para destravar o scheduler.
#
# Esta etapa é a VERIFICAÇÃO do deploy. Como o #44 não adiciona nenhuma rota nova, o
# teste de 404-vs-401 documentado no replit.md não distingue build velho de build
# novo. A tabela `opportunities` regenerada, sim: se o código novo estiver no ar,
# nenhum BDR entra (o piso de 3 indicadores reprova todos eles, que só têm P/L) e os
# FIIs saem com notas espalhadas em vez de empilhadas em 90+.
#
# APAGAR este arquivo depois de conferir.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Confere a escala das oportunidades regeneradas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL não configurado — abortando."
            exit 1
          fi
          echo "== o job já rodou? =="
          psql "$DATABASE_URL" -c "select job_name, last_run_at, last_status, last_error from job_runs;"
          echo "== quantas oportunidades, por categoria =="
          psql "$DATABASE_URL" -c "select category, count(*), min(score::numeric) as min, max(score::numeric) as max, round(avg(score::numeric),1) as media from opportunities group by category order by category;"
          echo "== BDRs (esperado: nenhum — piso de 3 indicadores) =="
          psql "$DATABASE_URL" -c "select count(*) as bdrs from opportunities where category = 'bdrs';"
          echo "== espalhamento das notas de FII (esperado: bem mais de 3 valores distintos) =="
          psql "$DATABASE_URL" -c "select count(distinct score) as notas_distintas, count(*) as fiis from opportunities where category = 'fiis';"
          echo "== topo da lista =="
          psql "$DATABASE_URL" -c "select ticker, category, score from opportunities order by score::numeric desc limit 12;"

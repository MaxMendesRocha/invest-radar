name: Limpa análises da escala antiga (one-off)

# Workflow temporário, criado só para a subida do PR #44.
#
# Etapa 1 (já executada): apagar `analyses` e `opportunities`, que guardavam scores da
# escala antiga — convivendo com as novas na mesma tela, um 71 velho apareceria ao lado
# de um 84 novo medindo coisas diferentes.
#
# Etapa 2 (esta): zerar o registro de execução do job `regenerate-opportunities` em
# `job_runs`. Apagar a tabela `opportunities` sozinha deixou a tela de Sugestões vazia
# até o próximo ciclo — o scheduler consulta `job_runs.lastRunAt` e o gap é de uma
# semana, então ele acharia que já rodou e não repovoaria nada por dias. Sem o
# lastRunAt, a próxima checagem horária (ou o próximo restart) regenera.
#
# APAGAR este arquivo depois de rodar.

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Destrava a regeneração de oportunidades
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL não configurado — abortando sem tocar em nada."
            exit 1
          fi
          echo "== antes =="
          psql "$DATABASE_URL" -c "select job_name, last_run_at, last_status from job_runs;"
          psql "$DATABASE_URL" -c "select count(*) as opportunities from opportunities;"
          psql "$DATABASE_URL" -c "delete from job_runs where job_name = 'regenerate-opportunities';"
          echo "== depois =="
          psql "$DATABASE_URL" -c "select job_name, last_run_at, last_status from job_runs;"
          echo "Feito. O scheduler regenera as oportunidades na próxima checagem horária ou no próximo restart."
